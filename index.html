<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авточасти - Склад & Двор</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen pb-20">

    <!-- Горна лента (Header) -->
    <header class="bg-blue-800 text-white p-4 sticky top-0 shadow-md z-10">
        <h1 class="text-xl font-bold text-center">🚗 Авточасти & Коли-Донори</h1>
    </header>

    <main class="p-4 max-w-md mx-auto space-y-6">

        <!-- 1. Секция: Търсачка за части -->
        <section class="bg-white p-4 rounded-xl shadow">
            <h2 class="text-lg font-bold mb-2">🔍 Бързо Търсене</h2>
            <div class="flex gap-2">
                <input id="searchInput" type="text" placeholder="Напр: Скоростна кутия E36..." 
                       class="w-full border p-2 rounded-lg text-sm border-gray-300">
                <button onclick="searchParts()" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold text-sm">Търси</button>
            </div>
            <div id="searchResults" class="mt-4 space-y-2"></div>
        </section>

        <!-- 2. Секция: Добавяне на Нова Кола-Донор -->
        <section class="bg-white p-4 rounded-xl shadow border-l-4 border-green-500">
            <h2 class="text-lg font-bold mb-2">➕ Нова Кола-Донор</h2>
            <form id="carForm" onsubmit="addCar(event)" class="space-y-3">
                <input type="text" id="carTitle" placeholder="Марка/Модел (напр. BMW E36 M50B20)" required class="w-full border p-2 rounded text-sm">
                <div class="flex gap-2">
                    <input type="number" id="carPrice" placeholder="Покупна цена (€)" required class="w-full border p-2 rounded text-sm">
                    <select id="carWarehouse" class="w-full border p-2 rounded text-sm">
                        <option value="1">Склад 1 (Основен)</option>
                        <option value="2">Склад 2 (Двор)</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-lg font-bold text-sm">Запази Кола</button>
            </form>
        </section>

        <!-- 3. Секция: Сканиране & Добавяне на Част -->
        <section class="bg-white p-4 rounded-xl shadow border-l-4 border-purple-500">
            <h2 class="text-lg font-bold mb-2">📷 Записване на Част</h2>
            
            <!-- Бутон за Камерата на Телефона -->
            <label class="flex items-center justify-center gap-2 bg-purple-100 border-2 border-dashed border-purple-400 p-4 rounded-xl cursor-pointer mb-3">
                <span class="text-2xl">📸</span>
                <span class="text-sm font-semibold text-purple-700">Снимай частта с Камера</span>
                <input type="file" accept="image/*" capture="camera" id="cameraInput" onchange="previewImage(event)" class="hidden">
            </label>

            <form id="partForm" onsubmit="addPart(event)" class="space-y-3">
                <input type="text" id="partTitle" placeholder="Име на частта (напр. Скоростна кутия)" required class="w-full border p-2 rounded text-sm">
                <input type="text" id="partOem" placeholder="OEM / Сериен номер (по избор)" class="w-full border p-2 rounded text-sm">
                
                <div class="flex gap-2">
                    <input type="number" id="partPrice" placeholder="Цена (€)" required class="w-full border p-2 rounded text-sm">
                    <select id="partStatus" class="w-full border p-2 rounded text-sm">
                        <option value="На колата">🚗 На колата</option>
                        <option value="На рафт">📦 На рафт</option>
                    </select>
                </div>

                <input type="text" id="partShelf" placeholder="Локация / Рафт (напр. Рафт A-2)" class="w-full border p-2 rounded text-sm">
                <button type="submit" class="w-full bg-purple-600 text-white py-2 rounded-lg font-bold text-sm">Запази Част</button>
            </form>
        </section>

    </main>

    <script>
        // ЛИНК КЪМ ТВОЯ РЕНДЪР БЕКЕНД
        const API_URL = "https://car-parts-k27f.onrender.com"; // <-- Сложи твоя линк от Render тук!

        // 1. Търсене на Част
        async function searchParts() {
            const query = document.getElementById("searchInput").value;
            if (!query) return;

            const res = await fetch(`${API_URL}/parts/search?q=${query}`);
            const data = await res.json();
            
            const resultsDiv = document.getElementById("searchResults");
            resultsDiv.innerHTML = "";

            if (data.length === 0) {
                resultsDiv.innerHTML = "<p class='text-sm text-gray-500'>Няма намерени части.</p>";
                return;
            }

            data.forEach(part => {
                resultsDiv.innerHTML += `
                    <div class="border p-3 rounded-lg bg-gray-50">
                        <div class="font-bold text-md text-blue-900">${part.title}</div>
                        <div class="text-xs text-gray-600">OEM: ${part.oem_number || 'Няма'}</div>
                        <div class="text-xs text-gray-600">Локация: ${part.shelf_location || part.status}</div>
                        <div class="text-sm font-bold text-green-600 mt-1">${part.price} €</div>
                        ${part.status !== 'Продадено' ? 
                          `<button onclick="sellPart(${part.id})" class="mt-2 text-xs bg-red-500 text-white px-2 py-1 rounded">Продадено</button>` : 
                          `<span class="text-xs font-bold text-red-600">[ПРОДАДЕНО]</span>`}
                    </div>
                `;
            });
        }

        // 2. Добавяне на Кола
        async function addCar(e) {
            e.preventDefault();
            const body = {
                title: document.getElementById("carTitle").value,
                purchase_price: parseFloat(document.getElementById("carPrice").value),
                warehouse_id: parseInt(document.getElementById("carWarehouse").value)
            };

            await fetch(`${API_URL}/cars/`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body)
            });

            alert("Колата е добавена успешно!");
            document.getElementById("carForm").reset();
        }

        // 3. Добавяне на Част
        async function addPart(e) {
            e.preventDefault();
            const body = {
                title: document.getElementById("partTitle").value,
                oem_number: document.getElementById("partOem").value,
                price: parseFloat(document.getElementById("partPrice").value),
                status: document.getElementById("partStatus").value,
                shelf_location: document.getElementById("partShelf").value
            };

            await fetch(`${API_URL}/parts/`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body)
            });

            alert("Частта е запазена!");
            document.getElementById("partForm").reset();
        }

        // 4. Отбелязване като Продадено
        async function sellPart(partId) {
            const soldPrice = prompt("Въведете крайната продажна цена (€):");
            if (!soldPrice) return;

            await fetch(`${API_URL}/parts/${partId}/sell`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ sold_price: parseFloat(soldPrice) })
            });

            alert("Продажбата е отчетена!");
            searchParts();
        }

        function previewImage(event) {
            alert("Снимката е заснета! (Можеш да я качиш към бекенда)");
        }
    </script>
</body>
</html>
