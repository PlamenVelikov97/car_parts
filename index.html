<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Parts Pro Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2b3674;
            --accent-color: #4318ff;
            --bg-body: #f4f7fe;
            --card-shadow: 0px 18px 40px rgba(112, 144, 176, 0.12);
        }

        body { 
            background-color: var(--bg-body); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #2b3674;
            padding-bottom: 60px; 
        }

        .navbar-brand {
            font-weight: 800;
            color: var(--primary-color) !important;
            letter-spacing: 0.5px;
        }

        .custom-card {
            background: #ffffff;
            border: none;
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            padding: 24px;
            transition: all 0.3s ease;
        }

        .nav-pills .nav-link {
            border-radius: 12px;
            font-weight: 600;
            color: #7090b0;
            padding: 12px 24px;
        }

        .nav-pills .nav-link.active {
            background-color: var(--accent-color);
            color: #fff;
            box-shadow: 0px 6px 16px rgba(67, 24, 255, 0.35);
        }

        .btn-custom-primary {
            background-color: var(--accent-color);
            color: #fff;
            border-radius: 12px;
            font-weight: 600;
            padding: 10px 20px;
            border: none;
        }

        .btn-custom-primary:hover {
            background-color: #3311cc;
            color: #fff;
        }

        .gallery-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
        }

        .gallery-img { 
            width: 80px; 
            height: 80px; 
            object-fit: cover; 
            border-radius: 12px; 
            cursor: pointer;
            border: 1px solid #e2e8f0;
            transition: transform 0.2s;
        }

        .gallery-img:hover {
            transform: scale(1.05);
        }

        .badge-available { background-color: #01b574; color: white; }
        .badge-sold { background-color: #ee5d50; color: white; }

        .notes-box {
            background: #f8fafc;
            border-left: 4px solid var(--accent-color);
            padding: 8px 12px;
            border-radius: 0 8px 8px 0;
            font-size: 0.9rem;
            color: #4a5568;
        }

        /* Жълт стил за коли на скрап */
        .car-card-scrapped {
            background-color: #fffdf0 !important;
            border: 2px solid #f6c23e !important;
            border-radius: 16px;
        }

        .car-card-normal {
            background-color: #f8fafc !important;
            border: 1px solid #e2e8f0 !important;
            border-radius: 16px;
        }

        .modal-body-img-container {
            text-align: center;
            background-color: #000;
            border-radius: 12px;
            padding: 10px;
        }
        .lightbox-img {
            max-height: 70vh;
            max-width: 100%;
            object-fit: contain;
        }

        .btn-big-action {
            font-weight: 700;
            padding: 10px 16px;
            border-radius: 10px;
        }

        /* Визуален списък за избор на Кола-Донор */
        .car-picker-container {
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 8px;
            background: #fff;
        }

        .car-picker-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 6px;
            border: 1px solid #f1f5f9;
            transition: background 0.2s;
        }

        .car-picker-item:hover {
            background-color: #f1f5f9;
        }

        .car-picker-item.selected {
            background-color: #e0e7ff;
            border-color: #6366f1;
        }

        .car-picker-img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 8px;
            margin-right: 12px;
            background-color: #e2e8f0;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg my-3">
    <div class="container">
        <a class="navbar-brand fs-3" href="#"><i class="fa-solid fa-car-rear me-2 text-primary"></i>AutoParts <span class="text-primary">PRO</span></a>
    </div>
</nav>

<div class="container">
    <ul class="nav nav-pills nav-justified mb-4 p-2 custom-card" id="mainTab" role="tablist">
        <li class="nav-item">
            <button class="nav-link active" id="search-tab" data-bs-toggle="tab" data-bs-target="#search-pane"><i class="fa-solid fa-magnifying-glass me-2"></i>Търсене</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" id="add-part-tab" data-bs-toggle="tab" data-bs-target="#add-part-pane" onclick="resetPartForm()"><i class="fa-solid fa-plus me-2"></i>Добави Част</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" id="cars-tab" data-bs-toggle="tab" data-bs-target="#cars-pane"><i class="fa-solid fa-warehouse me-2"></i>Коли / Складове</button>
        </li>
    </ul>

    <div class="tab-content" id="mainTabContent">
        
        <!-- 1. ТЪРСЕНЕ НА ЧАСТИ -->
        <div class="tab-pane fade show active" id="search-pane">
            <div class="custom-card mb-4">
                <h5 class="fw-bold mb-3"><i class="fa-solid fa-filter me-2 text-primary"></i>Филтри за търсене</h5>
                <div class="row g-2 mb-2">
                    <div class="col-md-3">
                        <label class="form-label small fw-bold">Текст / Марка / Модел / OEM</label>
                        <input type="text" id="search-query" class="form-control fs-6" placeholder="Търси напр. BMW, 320, OEM..." oninput="searchParts()">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small fw-bold">Марка</label>
                        <select id="filter-make" class="form-select fs-6" onchange="onMakeChange(); searchParts();">
                            <option value="">-- Всички марки --</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small fw-bold">Модел</label>
                        <select id="filter-model" class="form-select fs-6" onchange="onModelChange(); searchParts();">
                            <option value="">-- Всички модели --</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small fw-bold">Част / Название</label>
                        <select id="filter-part-name" class="form-select fs-6" onchange="searchParts()">
                            <option value="">-- Всички части --</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small fw-bold">Статус</label>
                        <select id="filter-status" class="form-select fs-6" onchange="searchParts()">
                            <option value="">-- Всички --</option>
                            <option value="Налично">Налични</option>
                            <option value="Продадено">Продадени</option>
                        </select>
                    </div>
                </div>
            </div>
            <div id="search-results"></div>
        </div>

        <!-- 2. ДОБАВЯНЕ / РЕДАКТИРАНЕ НА ЧАСТ -->
        <div class="tab-pane fade" id="add-part-pane">
            <div class="custom-card">
                <h4 class="fw-bold mb-4" id="part-form-title"><i class="fa-solid fa-wrench me-2 text-primary"></i>Добавяне на авточаст</h4>
                <form id="part-form" onsubmit="savePart(event)">
                    <input type="hidden" id="editing_part_id" value="">
                    <input type="hidden" id="part_car_id" value="">
                    
                    <!-- Избор на Кола Донор с визуална информация и снимки -->
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Избери Кола-Донор (Кликнете върху колата)</label>
                        <div class="car-picker-container" id="car-picker-list">
                            <!-- Зарежда се динамично -->
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Наименование на частта *</label>
                            <input type="text" id="part_title" class="form-control" required placeholder="напр. Скоростна кутия, Двигател, Предна броня...">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">OEM Номер</label>
                            <input type="text" id="part_oem" class="form-control" placeholder="напр. 8K0807225">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-semibold">Марка</label>
                            <input type="text" id="part_make" class="form-control" placeholder="напр. BMW">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-semibold">Модел</label>
                            <input type="text" id="part_model" class="form-control" placeholder="напр. 320">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-semibold">Година</label>
                            <input type="number" id="part_year" class="form-control" placeholder="напр. 2008">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Цена (лв.) *</label>
                            <input type="number" step="0.01" id="part_price" class="form-control" required placeholder="150.00">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Склад / Местоположение</label>
                            <select id="part_warehouse_id" class="form-select">
                                <option value="">-- Избери Склад --</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Бележки / Забележки</label>
                        <textarea id="part_notes" class="form-control" rows="2" placeholder="напр. Перфектно състояние, 6-степенна ръчна..."></textarea>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Снимки (До 10 снимки)</label>
                        <input type="file" id="part_photo_files" class="form-control" accept="image/*" multiple>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" id="part-submit-btn" class="btn btn-custom-primary flex-grow-1 py-3 fw-bold fs-5"><i class="fa-solid fa-floppy-disk me-2"></i>Запази Частта</button>
                        <button type="button" id="part-cancel-btn" class="btn btn-secondary d-none py-3 px-4 fw-bold" onclick="resetPartForm()">Отказ</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 3. УПРАВЛЕНИЕ НА СКЛАДОВЕ И КОЛИ -->
        <div class="tab-pane fade" id="cars-pane">
            <div class="row">
                <div class="col-md-5 mb-4">
                    <div class="custom-card">
                        <h5 class="fw-bold mb-3"><i class="fa-solid fa-warehouse me-2 text-primary"></i>Добави Нов Склад</h5>
                        <form onsubmit="saveWarehouse(event)">
                            <div class="mb-2">
                                <input type="text" id="wh_name" class="form-control" placeholder="Име на склад (напр. Склад А)" required>
                            </div>
                            <div class="mb-3">
                                <input type="text" id="wh_address" class="form-control" placeholder="Адрес / Описание">
                            </div>
                            <button type="submit" class="btn btn-outline-primary btn-sm w-100 mb-3 fw-bold">Създай Склад</button>
                        </form>
                        <h6 class="fw-bold text-muted">Налични складове:</h6>
                        <ul class="list-group list-group-flush" id="warehouses-list">
                            <li class="list-group-item text-muted">Зареждане...</li>
                        </ul>
                    </div>
                </div>

                <div class="col-md-7 mb-4">
                    <div class="custom-card">
                        <h5 class="fw-bold mb-3" id="car-form-title"><i class="fa-solid fa-car me-2 text-primary"></i>Добави Кола-Донор</h5>
                        <form id="car-form" onsubmit="saveCar(event)">
                            <input type="hidden" id="editing_car_id" value="">
                            <div class="row mb-2">
                                <div class="col-md-4 mb-2">
                                    <input type="text" id="car_make" class="form-control" placeholder="Марка (напр. BMW)" required>
                                </div>
                                <div class="col-md-4 mb-2">
                                    <input type="text" id="car_model" class="form-control" placeholder="Модел (напр. 320)" required>
                                </div>
                                <div class="col-md-4 mb-2">
                                    <input type="number" id="car_year" class="form-control" placeholder="Година (напр. 2008)">
                                </div>
                            </div>
                            <div class="row mb-2">
                                <div class="col-md-6 mb-2">
                                    <input type="text" id="car_engine" class="form-control" placeholder="Двигател (напр. 2.0d 177hp)">
                                </div>
                                <div class="col-md-6 mb-2">
                                    <select id="car_fuel_type" class="form-select">
                                        <option value="">-- Гориво --</option>
                                        <option value="Дизел">Дизел</option>
                                        <option value="Бензин">Бензин</option>
                                        <option value="Газ/Бензин">Газ/Бензин</option>
                                        <option value="Хибрид">Хибрид</option>
                                        <option value="Електро">Електро</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row mb-2">
                                <div class="col-md-6 mb-2">
                                    <input type="number" step="0.01" id="car_purchase_price" class="form-control" placeholder="Покупна цена (лв.)" required>
                                </div>
                                <div class="col-md-6 mb-2">
                                    <select id="car_warehouse_id" class="form-select" required>
                                        <option value="">-- Избери Склад --</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-2">
                                <textarea id="car_notes" class="form-control" rows="2" placeholder="Бележки за колата"></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Снимки на Колата (до 10)</label>
                                <input type="file" id="car_photo_files" class="form-control" accept="image/*" multiple>
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" id="car-submit-btn" class="btn btn-outline-success btn-sm flex-grow-1 fw-bold py-2">Запази Колата</button>
                                <button type="button" id="car-cancel-btn" class="btn btn-secondary btn-sm d-none fw-bold py-2 px-3" onclick="resetCarForm()">Отказ</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- СПИСЪК С КОЛИ, ТАБОВЕ ЗА СКРАП И ФИЛТЪР -->
            <div class="custom-card">
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-3 gap-2">
                    <!-- Бутони за превключване Налични / Скрап -->
                    <div class="btn-group" role="group">
                        <button type="button" class="btn btn-primary active fw-bold" id="btn-tab-active-cars" onclick="setCarTab('active')"><i class="fa-solid fa-car me-1"></i> Налични Коли</button>
                        <button type="button" class="btn btn-outline-warning text-dark fw-bold" id="btn-tab-scrapped-cars" onclick="setCarTab('scrapped')"><i class="fa-solid fa-recycle me-1"></i> На Скрап</button>
                    </div>

                    <div class="w-100 w-md-auto" style="min-width: 280px;">
                        <input type="text" id="car-search-input" class="form-control form-control-sm" placeholder="🔍 Търси кола (марка, модел...)" oninput="filterCarsList()">
                    </div>
                </div>
                <div id="cars-summary-list">
                    <p class="text-muted">Зареждане...</p>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- МОДАЛЕН ДИАЛОГ ЗА ПРЕГЛЕД НА СНИМКИ (LIGHTBOX GALLERY) -->
<div class="modal fade" id="imageModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content bg-dark text-white border-0">
      <div class="modal-header border-0 pb-0">
        <h6 class="modal-title" id="imageModalLabel">Преглед на снимка</h6>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body text-center">
        <div class="modal-body-img-container">
            <img id="modalImage" src="" class="lightbox-img" alt="Снимка">
        </div>
      </div>
      <div class="modal-footer border-0 d-flex justify-content-between">
        <button type="button" class="btn btn-outline-light" onclick="prevImage()"><i class="fa-solid fa-chevron-left me-1"></i> Предишна</button>
        <span id="imageCounter" class="text-muted small">1 / 1</span>
        <button type="button" class="btn btn-outline-light" onclick="nextImage()">Следваща <i class="fa-solid fa-chevron-right ms-1"></i></button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    let globalWarehouses = [];
    let globalCars = [];
    let globalParts = [];

    let activeCarTab = 'active'; // 'active' или 'scrapped'

    // Променливи за Модалната Галерия
    let currentGalleryPhotos = [];
    let currentPhotoIndex = 0;
    let photoModalInstance = null;

    document.addEventListener("DOMContentLoaded", function() {
        photoModalInstance = new bootstrap.Modal(document.getElementById('imageModal'));

        // Фикс за фокуса при затваряне на модала
        document.getElementById('imageModal').addEventListener('hide.bs.modal', function () {
            if (document.activeElement) {
                document.activeElement.blur();
            }
        });

        loadWarehouses();
        loadCars();
        loadCarsSummary();
        searchParts();
    });

    function formatDate(dateStr) {
        if (!dateStr) return 'Няма дата';
        try {
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr;
            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const year = d.getFullYear();
            const hours = String(d.getHours()).padStart(2, '0');
            const minutes = String(d.getMinutes()).padStart(2, '0');
            return `${day}.${month}.${year} г. ${hours}:${minutes} ч.`;
        } catch (e) {
            return dateStr;
        }
    }

    // --- ФУНКЦИИ ЗА МОДАЛНАТА ГАЛЕРИЯ С СНИМКИ ---
    function openImageModal(photos, startIndex) {
        if (!photos || photos.length === 0) return;
        currentGalleryPhotos = photos;
        currentPhotoIndex = startIndex;
        updateModalPhoto();
        photoModalInstance.show();
    }

    function updateModalPhoto() {
        const modalImg = document.getElementById('modalImage');
        const counter = document.getElementById('imageCounter');
        modalImg.src = currentGalleryPhotos[currentPhotoIndex];
        counter.textContent = `${currentPhotoIndex + 1} / ${currentGalleryPhotos.length}`;
    }

    function prevImage() {
        if (currentGalleryPhotos.length <= 1) return;
        currentPhotoIndex = (currentPhotoIndex - 1 + currentGalleryPhotos.length) % currentGalleryPhotos.length;
        updateModalPhoto();
    }

    function nextImage() {
        if (currentGalleryPhotos.length <= 1) return;
        currentPhotoIndex = (currentPhotoIndex + 1) % currentGalleryPhotos.length;
        updateModalPhoto();
    }

    document.addEventListener('keydown', function(e) {
        const modalElem = document.getElementById('imageModal');
        if (modalElem.classList.contains('show')) {
            if (e.key === 'ArrowLeft') prevImage();
            if (e.key === 'ArrowRight') nextImage();
        }
    });

    async function uploadMultipleFiles(fileInputId) {
        const fileInput = document.getElementById(fileInputId);
        if (!fileInput || fileInput.files.length === 0) return [];

        const formData = new FormData();
        for (let i = 0; i < Math.min(fileInput.files.length, 10); i++) {
            formData.append('files', fileInput.files[i]);
        }

        try {
            const res = await fetch('/upload-photos', { method: 'POST', body: formData });
            if (res.ok) {
                const data = await res.json();
                return data.photo_urls || [];
            }
        } catch (e) {
            console.error("Грешка при качване на снимки:", e);
        }
        return [];
    }

    async function loadWarehouses() {
        try {
            const res = await fetch('/warehouses');
            if (!res.ok) return;
            globalWarehouses = await res.json();
            
            const carSelect = document.getElementById('car_warehouse_id');
            const partSelect = document.getElementById('part_warehouse_id');
            const list = document.getElementById('warehouses-list');
            
            carSelect.innerHTML = '<option value="">-- Избери Склад --</option>';
            partSelect.innerHTML = '<option value="">-- Избери Склад --</option>';
            list.innerHTML = '';

            globalWarehouses.forEach(w => {
                carSelect.innerHTML += `<option value="${w.id}">${w.name}</option>`;
                partSelect.innerHTML += `<option value="${w.id}">${w.name}</option>`;
                list.innerHTML += `
                    <li class="list-group-item d-flex justify-content-between align-items-center bg-transparent px-0">
                        <div>
                            <strong>${w.name}</strong> <br><small class="text-muted">${w.address || 'Без адрес'}</small>
                        </div>
                        <div>
                            <button class="btn btn-sm btn-light me-1" onclick="editWarehouse(${w.id}, '${w.name}', '${w.address || ''}')"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn btn-sm btn-light text-danger" onclick="deleteWarehouse(${w.id})"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </li>`;
            });
        } catch (e) { console.error(e); }
    }

    async function saveWarehouse(e) {
        e.preventDefault();
        const data = {
            name: document.getElementById('wh_name').value,
            address: document.getElementById('wh_address').value || null
        };

        try {
            const res = await fetch('/warehouses', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });

            if (res.ok) {
                document.getElementById('wh_name').value = '';
                document.getElementById('wh_address').value = '';
                loadWarehouses();
            }
        } catch (err) { alert('Грешка: ' + err.message); }
    }

    async function editWarehouse(id, oldName, oldAddress) {
        const newName = prompt("Ново име за склада:", oldName);
        if (newName === null) return;

    // Изгражда интерактивния списък с коли и снимки във формата за част
    function renderCarPicker(selectedCarId = null) {
        const container = document.getElementById('car-picker-list');
        if (!container) return;

        let html = `
            <div class="car-picker-item ${!selectedCarId ? 'selected' : ''}" onclick="selectCarPicker('')">
                <div class="car-picker-img d-flex align-items-center justify-content-center bg-secondary text-white fw-bold"><i class="fa-solid fa-ban"></i></div>
                <div>
                    <strong>-- Без конкретна кола (Самостоятелна част) --</strong>
                </div>
            </div>`;

        globalCars.forEach(c => {
            const isSelected = selectedCarId == c.id;
            const imgUrl = (c.photo_urls && c.photo_urls.length > 0) ? c.photo_urls[0] : '';
            const imgHtml = imgUrl 
                ? `<img src="${imgUrl}" class="car-picker-img">`
                : `<div class="car-picker-img d-flex align-items-center justify-content-center bg-light"><i class="fa-solid fa-car text-muted fs-4"></i></div>`;

            const isScrapped = c.notes && c.notes.includes('[НА СКРАП]');
            const scrappedBadge = isScrapped ? `<span class="badge bg-warning text-dark ms-2"><i class="fa-solid fa-recycle me-1"></i>НА СКРАП</span>` : '';
            const whName = c.warehouses ? c.warehouses.name : 'Без склад';

            html += `
                <div class="car-picker-item ${isSelected ? 'selected' : ''}" onclick="selectCarPicker(${c.id})">
                    ${imgHtml}
                    <div>
                        <strong>🚗 ${c.title}</strong> ${scrappedBadge}<br>
                        <small class="text-muted">${c.engine || ''} ${c.fuel_type || ''} | <i class="fa-solid fa-warehouse me-1"></i>${whName}</small>
                    </div>
                </div>`;
        });

        container.innerHTML = html;
    }

    function selectCarPicker(carId) {
        document.getElementById('part_car_id').value = carId || '';
        renderCarPicker(carId);

        const makeInput = document.getElementById('part_make');
        const modelInput = document.getElementById('part_model');
        const yearInput = document.getElementById('part_year');
        const whSelect = document.getElementById('part_warehouse_id');

        if (!carId) {
            makeInput.disabled = false;
            modelInput.disabled = false;
            yearInput.disabled = false;
            return;
        }

        const selectedCar = globalCars.find(c => c.id == carId);
        if (selectedCar) {
            makeInput.value = selectedCar.make || '';
            modelInput.value = selectedCar.model || '';
            yearInput.value = selectedCar.year || '';
            if (selectedCar.warehouse_id) whSelect.value = selectedCar.warehouse_id;

            modelInput.disabled = true;
            yearInput.disabled = true;
        }

    function populateMakeDropdown() {
        const makeSelect = document.getElementById('filter-make');
        makeSelect.innerHTML = '<option value="">-- Всички марки --</option>';
        
        const carMakes = globalCars.map(c => c.make);
        const partMakes = globalParts.map(p => p.make);
        const allMakes = [...new Set([...carMakes, ...partMakes].filter(Boolean))];

        allMakes.sort().forEach(m => makeSelect.innerHTML += `<option value="${m}">${m}</option>`);
    }

    function onMakeChange() {
        const selectedMake = document.getElementById('filter-make').value;
        const modelSelect = document.getElementById('filter-model');
        modelSelect.innerHTML = '<option value="">-- Всички модели --</option>';
        
        if (!selectedMake) {
            onModelChange();
            return;
        }

        const filteredCarModels = globalCars.filter(c => c.make === selectedMake).map(c => c.model);
        const filteredPartModels = globalParts.filter(p => p.make === selectedMake).map(p => p.model);
        const allModels = [...new Set([...filteredCarModels, ...filteredPartModels].filter(Boolean))];

        allModels.sort().forEach(m => modelSelect.innerHTML += `<option value="${m}">${m}</option>`);
        onModelChange();
    }

    function onModelChange() {
        const selectedMake = document.getElementById('filter-make').value.toLowerCase();
        const selectedModel = document.getElementById('filter-model').value.toLowerCase();
        const partNameSelect = document.getElementById('filter-part-name');
        
        partNameSelect.innerHTML = '<option value="">-- Всички части --</option>';

        const availableParts = globalParts.filter(p => {
            const pMake = (p.make || (p.cars ? p.cars.make : '') || '').toLowerCase();
            const pModel = (p.model || (p.cars ? p.cars.model : '') || '').toLowerCase();

            const makeMatch = !selectedMake || pMake === selectedMake;
            const modelMatch = !selectedModel || pModel === selectedModel;
            return makeMatch && modelMatch;
        });

        const partTitles = [...new Set(availableParts.map(p => p.title).filter(Boolean))];
        partTitles.sort().forEach(t => {
            partNameSelect.innerHTML += `<option value="${t}">${t}</option>`;
        });
    }

    function filterCarsList() {

        const filteredCars = globalCars.filter(c => {
            const isScrapped = c.notes && c.notes.includes('[НА СКРАП]');

            if (!query) return true;
            const fullTitle = `${c.title || ''} ${c.make || ''} ${c.model || ''} ${c.engine || ''} ${c.notes || ''}`.toLowerCase();

        if (filteredCars.length === 0) {

    // Вземане на пари от Скрап
    async function scrapCar(carId, carTitle) {
        const priceStr = prompt(`Предаване на скрап на: ${carTitle}\nКолко пари взехте от скрап пункта (лв.)?`);
        if (!priceStr) return;

        const scrapPrice = parseFloat(priceStr);
        if (isNaN(scrapPrice) || scrapPrice < 0) {
            alert("Моля въведете валидна сума!");
            return;
        }

        const partData = {
            title: "Предадена на Скрап (Купе)",
            price: scrapPrice,
            status: "Продадено",
            car_id: carId,
            notes: "Скрап сума"
        };

        try {
            const res = await fetch('/parts', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(partData)
            });
            const createdPart = await res.json();
            const partId = Array.isArray(createdPart) ? createdPart[0].id : createdPart.id;

            if (partId) {
                await fetch(`/parts/${partId}/sell`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ sold_price: scrapPrice })
                });
            }

            const car = globalCars.find(c => c.id === carId);
            if (car) {
                const updatedNotes = (car.notes || '') + ` [НА СКРАП: ${scrapPrice} лв.]`;
                await fetch(`/cars/${carId}`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        make: car.make,
                        model: car.model,
                        year: car.year,
                        engine: car.engine,
                        fuel_type: car.fuel_type,
                        purchase_price: car.purchase_price,
                        warehouse_id: car.warehouse_id,
                        notes: updatedNotes,
                        photo_urls: car.photo_urls
                    })
                });
            }

            searchParts();
            loadCarsSummary();
            alert("Колата е предадена на скрап и е преместена в сектор 'На Скрап'!");
        } catch (err) { alert('Грешка: ' + err.message); }
    }

    async function searchParts() {
        const query = document.getElementById('search-query').value.trim().toLowerCase();
        const selectedMake = document.getElementById('filter-make').value.toLowerCase();
        const selectedModel = document.getElementById('filter-model').value.toLowerCase();
        const selectedPartName = document.getElementById('filter-part-name').value.toLowerCase();
        const selectedStatus = document.getElementById('filter-status').value;

        const container = document.getElementById('search-results');

        try {
            const res = await fetch('/parts/search');
            globalParts = await res.json();

            if (document.getElementById('filter-make').options.length <= 1) {
                populateMakeDropdown();
            }

            const filtered = globalParts.filter(p => {
                const pMake = (p.make || (p.cars ? p.cars.make : '') || '').toLowerCase();
                const pModel = (p.model || (p.cars ? p.cars.model : '') || '').toLowerCase();
                const pTitle = (p.title || '').toLowerCase();

                const textMatch = !query || 
                    pTitle.includes(query) || 
                    pMake.includes(query) || 
                    pModel.includes(query) || 
                    (p.oem_number && p.oem_number.toLowerCase().includes(query)) ||
                    (p.notes && p.notes.toLowerCase().includes(query));

                const makeMatch = !selectedMake || pMake === selectedMake;
                const modelMatch = !selectedModel || pModel === selectedModel;
                const partNameMatch = !selectedPartName || pTitle === selectedPartName;

                let statusMatch = true;
                if (selectedStatus) {
                    const currentStatus = p.status ? p.status.trim() : 'Налично';
                    statusMatch = (currentStatus.toLowerCase() === selectedStatus.toLowerCase());
                }

                return textMatch && makeMatch && modelMatch && partNameMatch && statusMatch;
            });

            if (filtered.length === 0) {
                container.innerHTML = '<p class="text-muted custom-card text-center py-4"><i class="fa-solid fa-circle-exclamation me-2"></i>Няма намерени части с тези филтри.</p>';
                return;
            }

            container.innerHTML = '';
            filtered.forEach(p => {
                const photos = (p.photo_urls && p.photo_urls.length > 0) ? p.photo_urls : (p.photo_url ? [p.photo_url] : []);
                
                let photosGallery = '';
                if (photos.length > 0) {
                    const photosJson = JSON.stringify(photos).replace(/"/g, '&quot;');
                    photosGallery = '<div class="gallery-container me-md-3 mb-2 mb-md-0">';
                    photos.forEach((url, idx) => {
                        photosGallery += `<img src="${url}" class="gallery-img" onclick="openImageModal(${photosJson}, ${idx})">`;
                    });
                    photosGallery += '</div>';
                }

                const makeStr = p.make || (p.cars ? p.cars.make : '');
                const modelStr = p.model || (p.cars ? p.cars.model : '');
                const yearStr = p.year || (p.cars ? p.cars.year : '');
                const autoInfo = `${makeStr} ${modelStr} ${yearStr ? '(' + yearStr + ')' : ''}`.trim() || 'Обща част';

                const whName = p.warehouses ? p.warehouses.name : (p.cars && p.cars.warehouses ? p.cars.warehouses.name : 'Без склад');
                const isSold = p.status === 'Продадено';
                const badgeClass = isSold ? 'badge-sold' : 'badge-available';

                const dateInfo = isSold 
                    ? `<small class="text-muted"><i class="fa-regular fa-clock me-1"></i>Продадена: <strong>${formatDate(p.sold_date)}</strong></small>`
                    : `<small class="text-muted"><i class="fa-regular fa-clock me-1"></i>Добавена: <strong>${formatDate(p.created_at)}</strong></small>`;

                const notesText = p.notes ? `<div class="notes-box mt-2"><i class="fa-regular fa-note-sticky me-1"></i>${p.notes}</div>` : '';

                container.innerHTML += `
                    <div class="custom-card mb-3 d-flex flex-column flex-md-row align-items-start align-items-md-center">
                        ${photosGallery}
                        <div class="flex-grow-1 my-2 my-md-0">
                            <h5 class="fw-bold mb-1">${p.title} <span class="badge bg-light text-dark border ms-2 fs-6">${autoInfo}</span></h5>
                            <p class="mb-1 text-muted"><small>OEM: ${p.oem_number || 'Няма'} | <i class="fa-solid fa-warehouse me-1"></i>${whName}</small></p>
                            ${dateInfo}
                            ${notesText}
                        </div>
                        <div class="text-md-end w-100 w-md-auto mt-2 mt-md-0 ms-md-3">
                            <span class="badge ${badgeClass} mb-2 d-inline-block px-3 py-2 rounded-3">${p.status || 'Налично'}</span>
                            <h3 class="fw-bold text-primary mb-2">${isSold ? (p.sold_price || p.price) : p.price} лв.</h3>
                            
                            <div class="d-flex flex-column gap-2 mt-2">
                                <div class="d-flex gap-1 justify-content-md-end">
                                    <button class="btn btn-sm btn-outline-primary fw-bold px-3" onclick="editPart(${p.id})"><i class="fa-solid fa-pen me-1"></i>Редактирай</button>
                                    <button class="btn btn-sm btn-outline-secondary text-danger fw-bold px-3" onclick="deletePart(${p.id})"><i class="fa-solid fa-trash me-1"></i>Изтрий</button>
                                </div>
                                ${!isSold ? `
                                    <button class="btn btn-danger btn-big-action w-100 fw-bold" onclick="sellPart(${p.id})">
                                        <i class="fa-solid fa-cart-shopping me-1"></i> ⚡ Продай Част
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    </div>`;
            });
        } catch (e) {
            container.innerHTML = '<p class="text-danger">Грешка при зареждането.</p>';
        }
    }

    async function sellPart(partId) {
        const price = prompt("Продажна цена (лв.):");
        if (!price) return;

        try {
            await fetch(`/parts/${partId}/sell`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ sold_price: parseFloat(price) })
            });
            searchParts();
            loadCarsSummary();
        } catch (err) { alert('Грешка: ' + err.message); }
    }

    async function deletePart(partId) {
        if (!confirm("Сигурни ли сте, че искате да изтриете тази част?")) return;
        try {
            await fetch(`/parts/${partId}`, { method: 'DELETE' });
            searchParts();
            loadCarsSummary();
        } catch (err) { alert('Грешка: ' + err.message); }
    }
</script>

</body>
</html>
