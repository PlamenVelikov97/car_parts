<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авточасти - Склад</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 min-h-screen">
    <div class="max-w-md mx-auto space-y-6">

        <!-- ТЪРСАЧКА -->
        <div class="bg-white p-4 rounded-2xl shadow">
            <h2 class="text-lg font-bold mb-2">🔍 Търсене на част</h2>
            <input type="text" id="searchInput" onkeyup="searchParts()" placeholder="Въведи име или OEM..." class="w-full border p-3 rounded-xl mb-2">
            <div id="searchResults" class="space-y-2"></div>
        </div>

        <!-- ФОРМА ЗА ДОБАВЯНЕ НА ЧАСТ -->
        <div class="bg-white p-4 rounded-2xl shadow space-y-3">
            <h2 class="text-lg font-bold">📸 Добави нова част</h2>

            <!-- БУТОН И INPUT ЗА КАМЕРАТА -->
            <div class="bg-blue-50 border-2 border-dashed border-blue-400 p-4 rounded-xl text-center">
                <label for="cameraInput" class="block cursor-pointer font-bold text-blue-600 text-lg">
                    📷 Натисни тук за Снимка / Камера
                </label>
                <input type="file" id="cameraInput" accept="image/*" capture="environment" class="mt-2 w-full text-sm">
            </div>

            <input type="text" id="partTitle" placeholder="Име на частта (напр. Заден фар)" class="w-full border p-3 rounded-xl">
            <input type="text" id="partOem" placeholder="OEM номер" class="w-full border p-3 rounded-xl">
            <input type="number" id="partPrice" placeholder="Цена (лв)" class="w-full border p-3 rounded-xl">
            <input type="text" id="partShelf" placeholder="Рафт / Място" class="w-full border p-3 rounded-xl">

            <button onclick="addPart()" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold text-lg shadow">
                Запази частта
            </button>
        </div>

        <!-- СПИСЪК С АВТОМОБИЛИ И ПРИХОДИ -->
        <div class="bg-white p-4 rounded-2xl shadow space-y-3">
            <h2 class="text-lg font-bold">🚘 Коли и Справка</h2>
            <button onclick="loadSummary()" class="w-full bg-gray-800 text-white py-2 rounded-xl text-sm font-semibold">Обнови данните</button>
            <div id="summaryList" class="space-y-2 mt-2"></div>
        </div>

    </div>

    <script>
        const API_URL = "";

        async function searchParts() {
            const query = document.getElementById('searchInput').value;
            if (query.length < 2) {
                document.getElementById('searchResults').innerHTML = "";
                return;
            }
            const res = await fetch(`${API_URL}/parts/search?q=${query}`);
            const data = await res.data ? res.data : await res.json();
            
            let html = "";
            data.forEach(p => {
                html += `
                    <div class="p-3 border rounded-xl bg-gray-50 flex justify-between items-center">
                        <div>
                            <div class="font-bold">${p.title}</div>
                            <div class="text-xs text-gray-500">OEM: ${p.oem_number || '-'} | Рафт: ${p.shelf_location || '-'}</div>
                            <div class="text-sm font-semibold text-green-600">${p.price} лв.</div>
                        </div>
                        ${p.status !== 'Продадено' ? `<button onclick="sellPart(${p.id})" class="bg-red-500 text-white px-3 py-1 rounded-lg text-xs font-bold">Продай</button>` : `<span class="text-xs text-gray-400 font-bold">Продадено</span>`}
                    </div>
                `;
            });
            document.getElementById('searchResults').innerHTML = html;
        }

        async function addPart() {
            const title = document.getElementById('partTitle').value;
            const price = document.getElementById('partPrice').value;
            const oem = document.getElementById('partOem').value;
            const shelf = document.getElementById('partShelf').value;

            if (!title || !price) {
                alert("Моля, въведи име и цена!");
                return;
            }

            await fetch(`${API_URL}/parts/`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    title: title,
                    price: parseFloat(price),
                    oem_number: oem,
                    shelf_location: shelf
                })
            });

            alert("Частта е добавена успешно!");
            document.getElementById('partTitle').value = "";
            document.getElementById('partPrice').value = "";
            document.getElementById('partOem').value = "";
            document.getElementById('partShelf').value = "";
        }

        async function sellPart(id) {
            const soldPrice = prompt("Въведи продажна цена:");
            if (!soldPrice) return;

            await fetch(`${API_URL}/parts/${id}/sell`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ sold_price: parseFloat(soldPrice) })
            });

            alert("Частта е маркирана като продадена!");
            searchParts();
        }

        async function loadSummary() {
            const res = await fetch(`${API_URL}/cars/summary`);
            const cars = await res.json();

            let html = "";
            cars.forEach(c => {
                html += `
                    <div class="p-3 border rounded-xl bg-gray-50">
                        <div class="font-bold text-gray-800">${c.title}</div>
                        <div class="text-xs text-gray-600">Покупка: ${c.purchase_price} лв.</div>
                        <div class="text-xs text-green-600">Продажби: ${c.total_sales} лв.</div>
                        <div class="text-xs font-bold ${c.net_profit >= 0 ? 'text-green-700' : 'text-red-600'}">Печалба: ${c.net_profit} лв.</div>
                    </div>
                `;
            });
            document.getElementById('summaryList').innerHTML = html;
        }

        loadSummary();
    </script>
</body>
</html>
