<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Автоморга Мениджър</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .nav-tabs .nav-link { font-weight: bold; cursor: pointer; }
        .badge-scrap { background-color: #6c757d; }
    </style>
</head>
<body>

<div class="container py-4">
    <h1 class="mb-4 text-center">🚗 Система за Управление на Автоморга</h1>

    <!-- НАВИГАЦИЯ -->
    <ul class="nav nav-tabs mb-4">
        <li class="nav-item">
            <a class="nav-link active" id="tab-cars" onclick="showTab('cars')">🚘 Коли-Донори</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" id="tab-parts" onclick="showTab('parts')">🔧 Авточасти</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" id="tab-warehouses" onclick="showTab('warehouses')">🏢 Складове</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" id="tab-financials" onclick="showTab('financials')">📊 Резултати</a>
        </li>
    </ul>

    <!-- 1. ТАБ: КОЛИ-ДОНОРИ -->
    <div id="carsTab" class="tab-content">
        <div class="d-flex justify-content-between mb-3">
            <h3>Коли в моргата</h3>
            <button class="btn btn-primary" onclick="openCarModal()">+ Добави Кола</button>
        </div>
        <div class="row" id="carsContainer"></div>
    </div>

    <!-- 2. ТАБ: АВТОЧАСТИ -->
    <div id="partsTab" class="tab-content" style="display:none;">
        <div class="d-flex justify-content-between mb-3">
            <h3>Налични Части</h3>
            <button class="btn btn-success" onclick="openPartModal()">+ Добави Част</button>
        </div>
        <div class="row" id="partsContainer"></div>
    </div>

    <!-- 3. ТАБ: СКЛАДОВЕ -->
    <div id="warehousesTab" class="tab-content" style="display:none;">
        <div class="d-flex justify-content-between mb-3">
            <h3>Управление на Складове</h3>
            <button class="btn btn-warning" onclick="openWarehouseModal()">+ Добави Склад</button>
        </div>
        <table class="table table-striped table-hover bg-white rounded shadow-sm">
            <thead class="table-dark">
                <tr>
                    <th>Име на Склад</th>
                    <th>Адрес</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody id="warehousesTableBody"></tbody>
        </table>
    </div>

    <!-- 4. ТАБ: РЕЗУЛТАТИ -->
    <div id="financialsTab" class="tab-content" style="display:none;">
        <h3>Финансови Резултати</h3>
        <div class="row mt-3">
            <div class="col-md-4">
                <div class="card text-white bg-danger mb-3">
                    <div class="card-body">
                        <h5 class="card-title">Общо Разходи</h5>
                        <h2 id="totalExpenses">0.00 лв.</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-primary mb-3">
                    <div class="card-body">
                        <h5 class="card-title">Общо Приходи</h5>
                        <h2 id="totalRevenues">0.00 лв.</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-success mb-3">
                    <div class="card-body">
                        <h5 class="card-title">Чиста Печалба</h5>
                        <h2 id="netProfit">0.00 лв.</h2>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- МОДАЛ ЗА СКЛАД -->
<div class="modal fade" id="warehouseModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="whModalTitle">Добави Склад</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="warehouseForm">
                    <input type="hidden" id="wh_id">
                    <div class="mb-3">
                        <label class="form-label">Име на склад</label>
                        <input type="text" id="wh_name" class="form-control" required placeholder="напр. Склад А">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Адрес / Описание</label>
                        <input type="text" id="wh_address" class="form-control" placeholder="напр. Сектор 3, Рафт B">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Запази</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function showTab(tabName) {
        document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
        document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
        
        document.getElementById(tabName + 'Tab').style.display = 'block';
        document.getElementById('tab-' + tabName).classList.add('active');

        if(tabName === 'warehouses') loadWarehouses();
        if(tabName === 'financials') loadFinancials();
        if(tabName === 'cars') loadCars();
        if(tabName === 'parts') loadParts();
    }

    async function loadWarehouses() {
        const res = await fetch('/warehouses');
        const warehouses = await res.json();
        const tbody = document.getElementById('warehousesTableBody');
        tbody.innerHTML = '';

        warehouses.forEach(wh => {
            tbody.innerHTML += `
                <tr>
                    <td><strong>${wh.name}</strong></td>
                    <td>${wh.address || 'Няма посочен адрес'}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-warning" onclick="editWarehouse(${wh.id}, '${wh.name}', '${wh.address || ''}')">Редактирай</button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteWarehouse(${wh.id})">Изтрий</button>
                    </td>
                </tr>
            `;
        });
    }

    const whModal = new bootstrap.Modal(document.getElementById('warehouseModal'));

    function openWarehouseModal() {
        document.getElementById('wh_id').value = '';
        document.getElementById('wh_name').value = '';
        document.getElementById('wh_address').value = '';
        document.getElementById('whModalTitle').innerText = 'Добави Склад';
        whModal.show();
    }

    function editWarehouse(id, name, address) {
        document.getElementById('wh_id').value = id;
        document.getElementById('wh_name').value = name;
        document.getElementById('wh_address').value = address;
        document.getElementById('whModalTitle').innerText = 'Редактирай Склад';
        whModal.show();
    }

    document.getElementById('warehouseForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('wh_id').value;
        const name = document.getElementById('wh_name').value;
        const address = document.getElementById('wh_address').value;

        const method = id ? 'PUT' : 'POST';
        const url = id ? `/warehouses/${id}` : `/warehouses`;

        await fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, address })
        });

        whModal.hide();
        loadWarehouses();
    });

    async function deleteWarehouse(id) {
        if(confirm('Сигурни ли сте, че искате да изтриете този склад?')) {
            await fetch(`/warehouses/${id}`, { method: 'DELETE' });
            loadWarehouses();
        }
    }

    async function loadCars() {
        const res = await fetch('/cars/summary');
        const cars = await res.json();
        const container = document.getElementById('carsContainer');
        container.innerHTML = '';

        cars.forEach(c => {
            container.innerHTML += `
                <div class="col-md-4 mb-3">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title">${c.title}</h5>
                            <p class="card-text">
                                Покупна цена: <strong>${c.purchase_price} лв.</strong><br>
                                Статус: <span class="badge ${c.status === 'Скрап' ? 'bg-secondary' : 'bg-success'}">${c.status}</span>
                            </p>
                        </div>
                    </div>
                </div>
            `;
        });
    }

    async function loadParts() {
        const res = await fetch('/parts/search');
        const parts = await res.json();
        const container = document.getElementById('partsContainer');
        container.innerHTML = '';

        parts.forEach(p => {
            container.innerHTML += `
                <div class="col-md-4 mb-3">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title">${p.title}</h5>
                            <p class="card-text">
                                Цена: <strong>${p.price} лв.</strong><br>
                                Статус: <span class="badge ${p.status === 'Продадено' ? 'bg-danger' : 'bg-primary'}">${p.status}</span>
                            </p>
                        </div>
                    </div>
                </div>
            `;
        });
    }

    async function loadFinancials() {
        const res = await fetch('/reports/financials');
        const data = await res.json();
        
        let expenses = 0;
        let revenue = 0;

        (data.cars || []).forEach(c => {
            expenses += (c.purchase_price || 0);
            revenue += (c.scrap_price || 0);
        });

        (data.parts || []).forEach(p => {
            if(p.status === 'Продадено') {
                revenue += (p.sold_price || 0);
            }
        });

        document.getElementById('totalExpenses').innerText = expenses.toFixed(2) + ' лв.';
        document.getElementById('totalRevenues').innerText = revenue.toFixed(2) + ' лв.';
        document.getElementById('netProfit').innerText = (revenue - expenses).toFixed(2) + ' лв.';
    }

    showTab('cars');
</script>
</body>
</html>
