<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Parts Pro Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2b3674;
            --accent-color: #4318ff;
            --bg-body: #f4f7fe;
            --card-shadow: 0px 18px 40px rgba(112, 144, 176, 0.12);
        }

        body { 
            background-color: var(--bg-body); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #2b3674;
            padding-bottom: 60px; 
        }

        .navbar-brand {
            font-weight: 800;
            color: var(--primary-color) !important;
            letter-spacing: 0.5px;
        }

        .custom-card {
            background: #ffffff;
            border: none;
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            padding: 24px;
            transition: all 0.3s ease;
        }

        .custom-card:hover {
            transform: translateY(-2px);
        }

        .nav-pills .nav-link {
            border-radius: 12px;
            font-weight: 600;
            color: #a3ed2d;
            color: #7090b0;
            padding: 12px 24px;
            transition: all 0.2s;
        }

        .nav-pills .nav-link.active {
            background-color: var(--accent-color);
            color: #fff;
            box-shadow: 0px 6px 16px rgba(67, 24, 255, 0.35);
        }

        .btn-custom-primary {
            background-color: var(--accent-color);
            color: #fff;
            border-radius: 12px;
            font-weight: 600;
            padding: 10px 20px;
            border: none;
        }

        .btn-custom-primary:hover {
            background-color: #3311cc;
            color: #fff;
        }

        .preview-img { 
            width: 90px; 
            height: 90px; 
            object-fit: cover; 
            border-radius: 14px; 
        }

        .badge-available { background-color: #01b574; color: white; }
        .badge-sold { background-color: #ee5d50; color: white; }

        .notes-box {
            background: #f8fafc;
            border-left: 4px solid var(--accent-color);
            padding: 8px 12px;
            border-radius: 0 8px 8px 0;
            font-size: 0.9rem;
            color: #4a5568;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg my-3">
    <div class="container">
        <a class="navbar-brand fs-3" href="#"><i class="fa-solid fa-car-rear me-2 text-primary"></i>AutoParts <span class="text-primary">PRO</span></a>
    </div>
</nav>

<div class="container">
    <!-- ТАБОВЕ -->
    <ul class="nav nav-pills nav-justified mb-4 p-2 custom-card" id="mainTab" role="tablist">
        <li class="nav-item">
            <button class="nav-link active" id="search-tab" data-bs-toggle="tab" data-bs-target="#search-pane"><i class="fa-solid fa-magnifying-glass me-2"></i>Търсене</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" id="add-part-tab" data-bs-toggle="tab" data-bs-target="#add-part-pane"><i class="fa-solid fa-plus me-2"></i>Добави Част</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" id="cars-tab" data-bs-toggle="tab" data-bs-target="#cars-pane"><i class="fa-solid fa-warehouse me-2"></i>Коли / Складове</button>
        </li>
    </ul>

    <div class="tab-content" id="mainTabContent">
        
        <!-- 1. ТЪРСЕНЕ НА ЧАСТИ -->
        <div class="tab-pane fade show active" id="search-pane">
            <div class="custom-card mb-4">
                <h5 class="fw-bold mb-3"><i class="fa-solid fa-filter me-2 text-primary"></i>Филтри за търсене</h5>
                <div class="row g-3">
                    <div class="col-md-3">
                        <input type="text" id="search-query" class="form-control form-control-lg fs-6" placeholder="Търси по Име, OEM, Бележка...">
                    </div>
                    <div class="col-md-2">
                        <select id="filter-make" class="form-select form-select-lg fs-6" onchange="onMakeChange()">
                            <option value="">-- Всички марки --</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <select id="filter-model" class="form-select form-select-lg fs-6">
                            <option value="">-- Всички модели --</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <input type="number" id="filter-year" class="form-control form-control-lg fs-6" placeholder="Година">
                    </div>
                    <div class="col-md-2">
                        <select id="filter-status" class="form-select form-select-lg fs-6">
                            <option value="">-- Всички статуси --</option>
                            <option value="Налично">Налични</option>
                            <option value="Продадено">Продадени</option>
                        </select>
                    </div>
                    <div class="col-md-1">
                        <button class="btn btn-custom-primary w-100 h-100 fw-bold" onclick="searchParts()"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </div>
                </div>
            </div>
            <div id="search-results"></div>
        </div>

        <!-- 2. ДОБАВЯНЕ НА ЧАСТ -->
        <div class="tab-pane fade" id="add-part-pane">
            <div class="custom-card">
                <h4 class="fw-bold mb-4"><i class="fa-solid fa-wrench me-2 text-primary"></i>Добавяне на авточаст</h4>
                <form id="part-form" onsubmit="savePart(event)">
                    
                    <div class="row mb-3">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Свържи с Кола-Донор (Опция)</label>
                            <select id="part_car_id" class="form-select" onchange="onDonorCarSelect()">
                                <option value="">-- Без конкретна кола (Самостоятелна част) --</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Наименование на частта *</label>
                            <input type="text" id="part_title" class="form-control" required placeholder="напр. Предна броня">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-semibold">Марка</label>
                            <input type="text" id="part_make" class="form-control" placeholder="напр. Audi">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-semibold">Модел</label>
                            <input type="text" id="part_model" class="form-control" placeholder="напр. A4">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-semibold">Година</label>
                            <input type="number" id="part_year" class="form-control" placeholder="напр. 2012">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-semibold">OEM Номер</label>
                            <input type="text" id="part_oem" class="form-control" placeholder="напр. 8K0807225">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-semibold">Цена (лв.) *</label>
                            <input type="number" step="0.01" id="part_price" class="form-control" required placeholder="150.00">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-semibold">Склад / Местоположение</label>
                            <select id="part_warehouse_id" class="form-select">
                                <option value="">-- Избери Склад --</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Бележки / Забележки</label>
                        <textarea id="part_notes" class="form-control" rows="2" placeholder="напр. Лек дефект, драскотина от ляво..."></textarea>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Снимка</label>
                        <input type="file" id="part_photo_file" class="form-control" accept="image/*" capture="environment">
                    </div>

                    <button type="submit" class="btn btn-custom-primary w-100 py-3 fw-bold fs-5"><i class="fa-solid fa-floppy-disk me-2"></i>Запази Частта</button>
                </form>
            </div>
        </div>

        <!-- 3. УПРАВЛЕНИЕ НА СКЛАДОВЕ И КОЛИ -->
        <div class="tab-pane fade" id="cars-pane">
            <div class="row">
                <!-- СКЛАДОВЕ -->
                <div class="col-md-5 mb-4">
                    <div class="custom-card">
                        <h5 class="fw-bold mb-3"><i class="fa-solid fa-warehouse me-2 text-primary"></i>Добави Нов Склад</h5>
                        <form onsubmit="saveWarehouse(event)">
                            <div class="mb-2">
                                <input type="text" id="wh_name" class="form-control" placeholder="Име на склад (напр. Склад А)" required>
                            </div>
                            <div class="mb-3">
                                <input type="text" id="wh_address" class="form-control" placeholder="Адрес / Описание">
                            </div>
                            <button type="submit" class="btn btn-outline-primary btn-sm w-100 mb-3 fw-bold">Създай Склад</button>
                        </form>
                        <h6 class="fw-bold text-muted">Налични складове:</h6>
                        <ul class="list-group list-group-flush" id="warehouses-list">
                            <li class="list-group-item text-muted">Зареждане...</li>
                        </ul>
                    </div>
                </div>

                <!-- КОЛИ -->
                <div class="col-md-7 mb-4">
                    <div class="custom-card">
                        <h5 class="fw-bold mb-3"><i class="fa-solid fa-car me-2 text-primary"></i>Добави Кола-Донор</h5>
                        <form onsubmit="saveCar(event)">
                            <div class="row mb-2">
                                <div class="col-md-4">
                                    <input type="text" id="car_make" class="form-control" placeholder="Марка (напр. BMW)" required>
                                </div>
                                <div class="col-md-4">
                                    <input type="text" id="car_model" class="form-control" placeholder="Модел (напр. E60)" required>
                                </div>
                                <div class="col-md-4">
                                    <input type="number" id="car_year" class="form-control" placeholder="Година (напр. 2006)">
                                </div>
                            </div>
                            <div class="row mb-2">
                                <div class="col-md-6">
                                    <input type="number" step="0.01" id="car_purchase_price" class="form-control" placeholder="Покупна цена (лв.)" required>
                                </div>
                                <div class="col-md-6">
                                    <select id="car_warehouse_id" class="form-select" required>
                                        <option value="">-- Избери Склад --</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-3">
                                <textarea id="car_notes" class="form-control" rows="2" placeholder="Бележки за колата (напр. Ударен заден капак)"></textarea>
                            </div>
                            <button type="submit" class="btn btn-outline-success btn-sm w-100 fw-bold py-2">Запази Колата</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- СПИСЪК С КОЛИ И БАЛАНС -->
            <div class="custom-card">
                <h5 class="fw-bold mb-3"><i class="fa-solid fa-chart-line me-2 text-primary"></i>Налични Коли и Финансов Баланс</h5>
                <div id="cars-summary-list">
                    <p class="text-muted">Зареждане...</p>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    let globalWarehouses = [];
    let globalCars = [];

    document.addEventListener("DOMContentLoaded", function() {
        loadWarehouses();
        loadCars();
        loadCarsSummary();
        searchParts();
    });

    async function loadWarehouses() {
        try {
            const res = await fetch('/warehouses');
            if (!res.ok) return;
            globalWarehouses = await res.json();
            
            const carSelect = document.getElementById('car_warehouse_id');
            const partSelect = document.getElementById('part_warehouse_id');
            const list = document.getElementById('warehouses-list');
            
            carSelect.innerHTML = '<option value="">-- Избери Склад --</option>';
            partSelect.innerHTML = '<option value="">-- Избери Склад --</option>';
            list.innerHTML = '';

            globalWarehouses.forEach(w => {
                carSelect.innerHTML += `<option value="${w.id}">${w.name}</option>`;
                partSelect.innerHTML += `<option value="${w.id}">${w.name}</option>`;
                list.innerHTML += `
                    <li class="list-group-item d-flex justify-content-between align-items-center bg-transparent px-0">
                        <div>
                            <strong>${w.name}</strong> <br><small class="text-muted">${w.address || 'Без адрес'}</small>
                        </div>
                        <div>
                            <button class="btn btn-sm btn-light me-1" onclick="editWarehouse(${w.id}, '${w.name}', '${w.address || ''}')"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn btn-sm btn-light text-danger" onclick="deleteWarehouse(${w.id})"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </li>`;
            });
        } catch (e) {
            console.error("Грешка при складове:", e);
        }
    }

    async function saveWarehouse(e) {
        e.preventDefault();
        const data = {
            name: document.getElementById('wh_name').value,
            address: document.getElementById('wh_address').value || null
        };

        try {
            const res = await fetch('/warehouses', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });

            if (res.ok) {
                document.getElementById('wh_name').value = '';
                document.getElementById('wh_address').value = '';
                loadWarehouses();
            }
        } catch (err) {
            alert('Грешка: ' + err.message);
        }
    }

    async function editWarehouse(id, oldName, oldAddress) {
        const newName = prompt("Ново име за склада:", oldName);
        if (newName === null) return;
        const newAddress = prompt("Нов адрес:", oldAddress);

        try {
            await fetch(`/warehouses/${id}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name: newName, address: newAddress || null })
            });
            loadWarehouses();
        } catch (err) {
            alert('Грешка: ' + err.message);
        }
    }

    async function deleteWarehouse(id) {
        if (!confirm("Сигурни ли сте, че искате да изтриете склада?")) return;
        try {
            await fetch(`/warehouses/${id}`, { method: 'DELETE' });
            loadWarehouses();
        } catch (err) {
            alert('Грешка: ' + err.message);
        }
    }

    async function loadCars() {
        try {
            const res = await fetch('/cars/summary');
            if (!res.ok) return;
            globalCars = await res.json();

            const select = document.getElementById('part_car_id');
            select.innerHTML = '<option value="">-- Без конкретна кола (Самостоятелна част) --</option>';
            globalCars.forEach(c => {
                select.innerHTML += `<option value="${c.id}">${c.title}</option>`;
            });

            populateMakeDropdown();
        } catch (e) {
            console.error("Грешка при коли:", e);
        }
    }

    function onDonorCarSelect() {
        const carId = document.getElementById('part_car_id').value;
        const makeInput = document.getElementById('part_make');
        const modelInput = document.getElementById('part_model');
        const yearInput = document.getElementById('part_year');
        const whSelect = document.getElementById('part_warehouse_id');

        if (!carId) {
            makeInput.disabled = false;
            modelInput.disabled = false;
            yearInput.disabled = false;
            return;
        }

        const selectedCar = globalCars.find(c => c.id == carId);
        if (selectedCar) {
            makeInput.value = selectedCar.make || '';
            modelInput.value = selectedCar.model || '';
            yearInput.value = selectedCar.year || '';
            if (selectedCar.warehouse_id) {
                whSelect.value = selectedCar.warehouse_id;
            }

            makeInput.disabled = true;
            modelInput.disabled = true;
            yearInput.disabled = true;
        }
    }

    function populateMakeDropdown() {
        const makeSelect = document.getElementById('filter-make');
        makeSelect.innerHTML = '<option value="">-- Всички марки --</option>';
        const makes = [...new Set(globalCars.map(c => c.make).filter(Boolean))];
        makes.sort().forEach(m => makeSelect.innerHTML += `<option value="${m}">${m}</option>`);
    }

    function onMakeChange() {
        const selectedMake = document.getElementById('filter-make').value;
        const modelSelect = document.getElementById('filter-model');
        modelSelect.innerHTML = '<option value="">-- Всички модели --</option>';
        if (!selectedMake) return;

        const filteredModels = globalCars.filter(c => c.make === selectedMake).map(c => c.model).filter(Boolean);
        [...new Set(filteredModels)].sort().forEach(m => modelSelect.innerHTML += `<option value="${m}">${m}</option>`);
    }

    async function saveCar(e) {
        e.preventDefault();
        const data = {
            make: document.getElementById('car_make').value,
            model: document.getElementById('car_model').value,
            year: parseInt(document.getElementById('car_year').value) || null,
            purchase_price: parseFloat(document.getElementById('car_purchase_price').value),
            warehouse_id: parseInt(document.getElementById('car_warehouse_id').value),
            notes: document.getElementById('car_notes').value || null
        };

        try {
            const res = await fetch('/cars', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });

            if (res.ok) {
                document.getElementById('car_make').value = '';
                document.getElementById('car_model').value = '';
                document.getElementById('car_year').value = '';
                document.getElementById('car_purchase_price').value = '';
                document.getElementById('car_notes').value = '';
                loadCars();
                loadCarsSummary();
            }
        } catch (err) {
            alert('Грешка: ' + err.message);
        }
    }

    async function loadCarsSummary() {
        const container = document.getElementById('cars-summary-list');
        try {
            const res = await fetch('/cars/summary');
            const cars = await res.json();
            container.innerHTML = '';
            
            cars.forEach(c => {
                const profitClass = c.net_profit >= 0 ? 'text-success' : 'text-danger';
                const whName = c.warehouses ? c.warehouses.name : 'Без склад';
                const notesText = c.notes ? `<div class="notes-box mt-2"><i class="fa-regular fa-note-sticky me-1"></i>${c.notes}</div>` : '';

                container.innerHTML += `
                    <div class="border-0 bg-light rounded-4 p-3 mb-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h5 class="mb-0 fw-bold">🚗 ${c.title}</h5>
                                <small class="text-muted"><i class="fa-solid fa-warehouse me-1"></i>${whName} | <i class="fa-regular fa-calendar me-1"></i>Купена: ${c.purchase_date || 'Няма дата'}</small>
                            </div>
                            <div>
                                <button class="btn btn-sm btn-success me-1 fw-bold" onclick="quickSellPartFromCar(${c.id}, '${c.title}')">⚡ Продай Част</button>
                                <button class="btn btn-sm btn-light text-danger" onclick="deleteCar(${c.id})"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                        ${notesText}
                        <div class="row text-center mt-3 pt-2 border-top">
                            <div class="col-4"><small class="text-muted">Покупна цена</small><br><strong class="fs-6">${c.purchase_price} лв.</strong></div>
                            <div class="col-4"><small class="text-muted">Продажби</small><br><strong class="fs-6 text-primary">${c.total_sales} лв.</strong></div>
                            <div class="col-4"><small class="text-muted">Печалба</small><br><strong class="fs-6 ${profitClass}">${c.net_profit} лв.</strong></div>
                        </div>
                    </div>`;
            });
        } catch (e) {
            container.innerHTML = '<p class="text-danger">Грешка при зареждане.</p>';
        }
    }

    async function quickSellPartFromCar(carId, carTitle) {
        const partName = prompt(`Сваляне на част от: ${carTitle}\nНаименование:`);
        if (!partName) return;
        const priceStr = prompt(`Продажна цена за "${partName}" (лв.):`);
        if (!priceStr) return;

        const soldPrice = parseFloat(priceStr);
        const partData = {
            title: partName,
            price: soldPrice,
            status: "Продадено",
            car_id: carId
        };

        try {
            const res = await fetch('/parts', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(partData)
            });
            const createdPart = await res.json();
            const partId = Array.isArray(createdPart) ? createdPart[0].id : createdPart.id;

            if (partId) {
                await fetch(`/parts/${partId}/sell`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ sold_price: soldPrice })
                });
            }
            searchParts();
            loadCarsSummary();
        } catch (err) {
            alert('Грешка: ' + err.message);
        }
    }

    async function deleteCar(id) {
        if (!confirm("Сигурни ли сте, че искате да изтриете колата?")) return;
        try {
            await fetch(`/cars/${id}`, { method: 'DELETE' });
            loadCars();
            loadCarsSummary();
        } catch (err) {
            alert('Грешка: ' + err.message);
        }
    }

    async function savePart(e) {
        e.preventDefault();
        let photo_url = null;

        const fileInput = document.getElementById('part_photo_file');
        if (fileInput.files.length > 0) {
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            try {
                const uploadRes = await fetch('/upload-photo', { method: 'POST', body: formData });
                if (uploadRes.ok) photo_url = (await uploadRes.json()).photo_url;
            } catch (err) { console.error(err); }
        }

        const carIdVal = document.getElementById('part_car_id').value;
        const whIdVal = document.getElementById('part_warehouse_id').value;

        const partData = {
            title: document.getElementById('part_title').value,
            make: document.getElementById('part_make').value || null,
            model: document.getElementById('part_model').value || null,
            year: parseInt(document.getElementById('part_year').value) || null,
            oem_number: document.getElementById('part_oem').value || null,
            price: parseFloat(document.getElementById('part_price').value),
            warehouse_id: whIdVal ? parseInt(whIdVal) : null,
            car_id: carIdVal ? parseInt(carIdVal) : null,
            photo_url: photo_url,
            notes: document.getElementById('part_notes').value || null
        };

        try {
            const res = await fetch('/parts', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(partData)
            });

            if (res.ok) {
                alert('Частта е добавена!');
                document.getElementById('part-form').reset();
                searchParts();
                loadCarsSummary();
            }
        } catch (err) {
            alert('Грешка: ' + err.message);
        }
    }

    async function searchParts() {
        const query = document.getElementById('search-query').value.trim().toLowerCase();
        const selectedMake = document.getElementById('filter-make').value.toLowerCase();
        const selectedModel = document.getElementById('filter-model').value.toLowerCase();
        const selectedYear = document.getElementById('filter-year').value;
        const selectedStatus = document.getElementById('filter-status').value;

        const container = document.getElementById('search-results');
        container.innerHTML = '<p class="text-muted">Търсене...</p>';

        try {
            const res = await fetch('/parts/search');
            const data = await res.json();

            const filtered = data.filter(p => {
                const pMake = (p.make || (p.cars ? p.cars.make : '') || '').toLowerCase();
                const pModel = (p.model || (p.cars ? p.cars.model : '') || '').toLowerCase();
                const pYear = p.year || (p.cars ? p.cars.year : null);

                const textMatch = !query || 
                    (p.title && p.title.toLowerCase().includes(query)) || 
                    (p.oem_number && p.oem_number.toLowerCase().includes(query)) ||
                    (p.notes && p.notes.toLowerCase().includes(query));

                const makeMatch = !selectedMake || pMake === selectedMake;
                const modelMatch = !selectedModel || pModel === selectedModel;
                const yearMatch = !selectedYear || pYear == selectedYear;
                const statusMatch = !selectedStatus || p.status === selectedStatus;

                return textMatch && makeMatch && modelMatch && yearMatch && statusMatch;
            });

            if (filtered.length === 0) {
                container.innerHTML = '<p class="text-muted">Няма намерени части.</p>';
                return;
            }

            container.innerHTML = '';
            filtered.forEach(p => {
                const imgTag = p.photo_url ? `<img src="${p.photo_url}" class="preview-img me-3">` : '';
                const makeStr = p.make || (p.cars ? p.cars.make : '');
                const modelStr = p.model || (p.cars ? p.cars.model : '');
                const yearStr = p.year || (p.cars ? p.cars.year : '');
                const autoInfo = `${makeStr} ${modelStr} ${yearStr ? '(' + yearStr + ')' : ''}`.trim() || 'Обща част';

                const whName = p.warehouses ? p.warehouses.name : (p.cars && p.cars.warehouses ? p.cars.warehouses.name : 'Без склад');
                const badgeClass = p.status === 'Продадено' ? 'badge-sold' : 'badge-available';

                const dateInfo = p.status === 'Продадено' 
                    ? `<small class="text-muted"><i class="fa-regular fa-clock me-1"></i>Продадена на: ${p.sold_date || 'Няма дата'}</small>`
                    : `<small class="text-muted"><i class="fa-regular fa-clock me-1"></i>Добавена: ${p.created_at || 'Няма дата'}</small>`;

                const notesText = p.notes ? `<div class="notes-box mt-2"><i class="fa-regular fa-note-sticky me-1"></i>${p.notes}</div>` : '';

                container.innerHTML += `
                    <div class="custom-card mb-3 d-flex flex-column flex-md-row align-items-start align-items-md-center">
                        ${imgTag}
                        <div class="flex-grow-1 my-2 my-md-0">
                            <h5 class="fw-bold mb-1">${p.title} <span class="badge bg-light text-dark border ms-2 fs-6">${autoInfo}</span></h5>
                            <p class="mb-1 text-muted"><small>OEM: ${p.oem_number || 'Няма'} | <i class="fa-solid fa-warehouse me-1"></i>${whName}</small></p>
                            ${dateInfo}
                            ${notesText}
                        </div>
                        <div class="text-md-end w-100 w-md-auto mt-2 mt-md-0">
                            <span class="badge ${badgeClass} mb-2 d-inline-block px-3 py-2 rounded-3">${p.status}</span>
                            <h3 class="fw-bold text-primary mb-2">${p.sold_price || p.price} лв.</h3>
                            ${p.status !== 'Продадено' ? `<button class="btn btn-sm btn-outline-danger fw-bold" onclick="sellPart(${p.id})">Маркирай Продадена</button>` : ''}
                        </div>
                    </div>`;
            });
        } catch (e) {
            container.innerHTML = '<p class="text-danger">Грешка при зареждането.</p>';
        }
    }

    async function sellPart(partId) {
        const price = prompt("Продажна цена (лв.):");
        if (!price) return;

        try {
            await fetch(`/parts/${partId}/sell`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ sold_price: parseFloat(price) })
            });
            searchParts();
            loadCarsSummary();
        } catch (err) {
            alert('Грешка: ' + err.message);
        }
    }
</script>
