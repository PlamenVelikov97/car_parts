<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Parts Inventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-bottom: 50px; }
        .card { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .preview-img { max-width: 100px; max-height: 100px; object-fit: cover; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container mt-4">
    <h2 class="text-center mb-4">🚗 Управление на Автоморги & Части</h2>

    <!-- ТАБОВЕ ЗА НАВИГАЦИЯ -->
    <ul class="nav nav-pills nav-justified mb-4" id="mainTab" role="tablist">
        <li class="nav-item">
            <button class="nav-link active" id="search-tab" data-bs-toggle="tab" data-bs-target="#search-pane">🔍 Търсене</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" id="add-part-tab" data-bs-toggle="tab" data-bs-target="#add-part-pane">➕ Добави Част</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" id="cars-tab" data-bs-toggle="tab" data-bs-target="#cars-pane">🚘 Коли / Складове</button>
        </li>
    </ul>

    <div class="tab-content" id="mainTabContent">
        
        <!-- 1. ТЪРСЕНЕ НА ЧАСТИ И КОЛИ -->
        <div class="tab-pane fade show active" id="search-pane">
            <div class="card p-3 mb-4">
                <h4>Търсене на авточаст или кола</h4>
                <div class="input-group">
                    <input type="text" id="search-query" class="form-control" placeholder="Натиснете Търси за всички части или въведете име, OEM, марка, модел...">
                    <button class="btn btn-primary" onclick="searchParts()">Търси</button>
                </div>
            </div>
            <div id="search-results"></div>
        </div>

        <!-- 2. ДОБАВЯНЕ НА ЧАСТ -->
        <div class="tab-pane fade" id="add-part-pane">
            <div class="card p-4">
                <h4>Добавяне на нова част</h4>
                <form id="part-form" onsubmit="savePart(event)">
                    <div class="mb-3">
                        <label class="form-label">Наименование на частта *</label>
                        <input type="text" id="part_title" class="form-control" required placeholder="напр. Предна броня">
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">OEM Номер</label>
                            <input type="text" id="part_oem" class="form-control" placeholder="напр. 8K0807225">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Цена (лв.) *</label>
                            <input type="number" step="0.01" id="part_price" class="form-control" required placeholder="150.00">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Избери Кола</label>
                            <select id="part_car_id" class="form-select">
                                <option value="">-- Избери Кола --</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Място / Склад</label>
                            <input type="text" id="part_shelf" class="form-control" placeholder="напр. Рафт A-12">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Снимка (От камера или галерия)</label>
                        <input type="file" id="part_photo_file" class="form-control" accept="image/*" capture="environment">
                    </div>
                    <button type="submit" class="btn btn-success w-100">Запази Частта</button>
                </form>
            </div>
        </div>

        <!-- 3. УПРАВЛЕНИЕ НА СКЛАДОВЕ И КОЛИ -->
        <div class="tab-pane fade" id="cars-pane">
            <div class="row">
                <!-- ДОБАВЯНЕ НА СКЛАД -->
                <div class="col-md-6 mb-4">
                    <div class="card p-3">
                        <h5>🏭 Добави Нов Склад</h5>
                        <form onsubmit="saveWarehouse(event)">
                            <div class="mb-2">
                                <input type="text" id="wh_name" class="form-control" placeholder="Име на склад (напр. Заден двор)" required>
                            </div>
                            <div class="mb-2">
                                <input type="text" id="wh_address" class="form-control" placeholder="Адрес / Бележка">
                            </div>
                            <button type="submit" class="btn btn-outline-primary btn-sm w-100">Създай Склад</button>
                        </form>
                    </div>
                </div>

                <!-- ДОБАВЯНЕ НА КОЛА С ОТДЕЛНИ ПОЛЕТА МАРКА И МОДЕЛ -->
                <div class="col-md-6 mb-4">
                    <div class="card p-3">
                        <h5>🚗 Добави Нова Кола-Донор</h5>
                        <form onsubmit="saveCar(event)">
                            <div class="row mb-2">
                                <div class="col-6">
                                    <input type="text" id="car_make" class="form-control" placeholder="Марка (напр. Audi)" required>
                                </div>
                                <div class="col-6">
                                    <input type="text" id="car_model" class="form-control" placeholder="Модел (напр. A4 B8)" required>
                                </div>
                            </div>
                            <div class="mb-2">
                                <input type="number" step="0.01" id="car_purchase_price" class="form-control" placeholder="Покупна цена (лв.)" required>
                            </div>
                            <div class="mb-2">
                                <select id="car_warehouse_id" class="form-select" required>
                                    <option value="">-- Избери Склад --</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-outline-success btn-sm w-100">Запази Колата</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- СПИСЪК С КОЛИ И БАЛАНС -->
            <div class="card p-3">
                <h5>📊 Налични Коли и Финансов Баланс</h5>
                <div id="cars-summary-list" class="mt-3">
                    <p class="text-muted">Зареждане на данните...</p>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        loadWarehouses();
        loadCars();
        loadCarsSummary();
        searchParts(); // Автоматично зарежда всички части при отваряне
    });

    async function loadWarehouses() {
        try {
            const res = await fetch('/warehouses');
            if (!res.ok) return;
            const warehouses = await res.json();
            const select = document.getElementById('car_warehouse_id');
            select.innerHTML = '<option value="">-- Избери Склад --</option>';
            warehouses.forEach(w => {
                select.innerHTML += `<option value="${w.id}">${w.name}</option>`;
            });
        } catch (e) {
            console.error("Грешка при складове:", e);
        }
    }

    async function loadCars() {
        try {
            const res = await fetch('/cars/summary');
            if (!res.ok) return;
            const cars = await res.json();
            const select = document.getElementById('part_car_id');
            select.innerHTML = '<option value="">-- Без конкретна кола --</option>';
            cars.forEach(c => {
                select.innerHTML += `<option value="${c.id}">${c.title}</option>`;
            });
        } catch (e) {
            console.error("Грешка при коли:", e);
        }
    }

    async function loadCarsSummary() {
        const container = document.getElementById('cars-summary-list');
        try {
            const res = await fetch('/cars/summary');
            if (!res.ok) {
                container.innerHTML = '<p class="text-danger">Грешка при зареждане на баланса.</p>';
                return;
            }
            const cars = await res.json();
            if (cars.length === 0) {
                container.innerHTML = '<p class="text-muted">Все още няма въведени коли.</p>';
                return;
            }
            container.innerHTML = '';
            cars.forEach(c => {
                const profitClass = c.net_profit >= 0 ? 'text-success' : 'text-danger';
                container.innerHTML += `
                    <div class="border rounded p-3 mb-2 bg-light">
                        <h6>🚗 <strong>${c.title}</strong></h6>
                        <div class="row text-center mt-2">
                            <div class="col-4"><small class="text-muted">Покупка</small><br><strong>${c.purchase_price} лв.</strong></div>
                            <div class="col-4"><small class="text-muted">Продажби</small><br><strong class="text-primary">${c.total_sales} лв.</strong></div>
                            <div class="col-4"><small class="text-muted">Печалба/Загуба</small><br><strong class="${profitClass}">${c.net_profit} лв.</strong></div>
                        </div>
                    </div>`;
            });
        } catch (e) {
            container.innerHTML = '<p class="text-danger">Грешка при зареждане на баланса.</p>';
        }
    }

    async function saveWarehouse(e) {
        e.preventDefault();
        const data = {
            name: document.getElementById('wh_name').value,
            address: document.getElementById('wh_address').value || null
        };

        try {
            const res = await fetch('/warehouses', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });

            if (!res.ok) {
                const errorData = await res.json();
                alert('Грешка: ' + JSON.stringify(errorData));
                return;
            }

            alert('Складът е добавен успешно!');
            document.getElementById('wh_name').value = '';
            document.getElementById('wh_address').value = '';
            loadWarehouses();
        } catch (err) {
            alert('Грешка при връзката: ' + err.message);
        }
    }

    async function saveCar(e) {
        e.preventDefault();
        const data = {
            make: document.getElementById('car_make').value,
            model: document.getElementById('car_model').value,
            purchase_price: parseFloat(document.getElementById('car_purchase_price').value),
            warehouse_id: parseInt(document.getElementById('car_warehouse_id').value)
        };

        try {
            const res = await fetch('/cars', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });

            if (!res.ok) {
                const errorData = await res.json();
                alert('Грешка: ' + JSON.stringify(errorData));
                return;
            }

            alert('Колата е добавена успешно!');
            document.getElementById('car_make').value = '';
            document.getElementById('car_model').value = '';
            document.getElementById('car_purchase_price').value = '';
            loadCars();
            loadCarsSummary();
        } catch (err) {
            alert('Грешка при връзката: ' + err.message);
        }
    }

    async function savePart(e) {
        e.preventDefault();
        let photo_url = null;

        const fileInput = document.getElementById('part_photo_file');
        if (fileInput.files.length > 0) {
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            
            try {
                const uploadRes = await fetch('/upload-photo', {
                    method: 'POST',
                    body: formData
                });
                if (uploadRes.ok) {
                    const uploadData = await uploadRes.json();
                    photo_url = uploadData.photo_url;
                }
            } catch (uploadErr) {
                console.error("Грешка при снимката:", uploadErr);
            }
        }

        const car_id_val = document.getElementById('part_car_id').value;
        const partData = {
            title: document.getElementById('part_title').value,
            oem_number: document.getElementById('part_oem').value || null,
            price: parseFloat(document.getElementById('part_price').value),
            shelf_location: document.getElementById('part_shelf').value || null,
            car_id: car_id_val ? parseInt(car_id_val) : null,
            photo_url: photo_url
        };

        try {
            const res = await fetch('/parts', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(partData)
            });

            if (!res.ok) {
                const errorData = await res.json();
                alert('Грешка при добавяне на част: ' + JSON.stringify(errorData));
                return;
            }

            alert('Частта е добавена успешно!');
            document.getElementById('part-form').reset();
            searchParts();
            loadCarsSummary();
        } catch (err) {
            alert('Грешка при връзката: ' + err.message);
        }
    }

    // ТЪРСЕНЕ: Без изискване за 2 символа + показва и данните на колата
    async function searchParts() {
        const query = document.getElementById('search-query').value.trim();
        const container = document.getElementById('search-results');
        container.innerHTML = '<p class="text-muted">Зареждане...</p>';

        try {
            const url = query ? `/parts/search?q=${encodeURIComponent(query)}` : '/parts/search';
            const res = await fetch(url);
            const parts = await res.json();

            if (parts.length === 0) {
                container.innerHTML = '<p class="text-muted">Няма намерени резултати.</p>';
                return;
            }

            container.innerHTML = '';
            parts.forEach(p => {
                const imgTag = p.photo_url ? `<img src="${p.photo_url}" class="preview-img me-3">` : '';
                
                // Извличане на марка/модел на колата, ако е свързана
                let carInfo = 'Обща част';
                if (p.cars) {
                    carInfo = `${p.cars.make || ''} ${p.cars.model || ''}`.trim() || p.cars.title || 'Кола';
                }

                container.innerHTML += `
                    <div class="card p-3 mb-2 d-flex flex-row align-items-center">
                        ${imgTag}
                        <div class="flex-grow-1">
                            <h5 class="mb-1">${p.title} <small class="text-primary">(${carInfo})</small></h5>
                            <p class="mb-1 text-muted"><small>OEM: ${p.oem_number || 'Няма'} | Място: ${p.shelf_location || 'Няма'}</small></p>
                            <span class="badge bg-${p.status === 'Продадено' ? 'danger' : 'success'}">${p.status}</span>
                        </div>
                        <div class="text-end">
                            <h4 class="text-primary mb-2">${p.price} лв.</h4>
                            ${p.status !== 'Продадено' ? `<button class="btn btn-sm btn-outline-danger" onclick="sellPart(${p.id})">Маркирай Продадена</button>` : ''}
                        </div>
                    </div>`;
            });
        } catch (e) {
            container.innerHTML = '<p class="text-danger">Грешка при търсенето.</p>';
        }
    }

    async function sellPart(partId) {
        const price = prompt("Въведете крайната цена, на която е продадена частта (лв.):");
        if (!price) return;

        try {
            await fetch(`/parts/${partId}/sell`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ sold_price: parseFloat(price) })
            });

            alert('Частта е маркирана като продадена!');
            searchParts();
            loadCarsSummary();
        } catch (err) {
            alert('Грешка: ' + err.message);
        }
    }
</script>

</body>
</html>
