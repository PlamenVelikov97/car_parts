<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авточасти & Двор</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen pb-20">

    <header class="bg-blue-800 text-white p-4 sticky top-0 shadow-md z-10 flex justify-between items-center">
        <h1 class="text-xl font-bold">🚗 Склад & Коли</h1>
        <button onclick="loadAllData()" class="bg-blue-600 hover:bg-blue-700 text-xs text-white px-3 py-1 rounded shadow">🔄 Обнови</button>
    </header>

    <main class="p-4 max-w-md mx-auto space-y-6">

        <!-- 1. Търсачка за части -->
        <section class="bg-white p-4 rounded-xl shadow">
            <h2 class="text-lg font-bold mb-2">🔍 Бързо Търсене на Част</h2>
            <div class="flex gap-2">
                <input id="searchInput" type="text" placeholder="Напр: Скоростна кутия E36..." class="w-full border p-2 rounded-lg text-sm border-gray-300">
                <button onclick="searchParts()" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold text-sm">Търси</button>
            </div>
            <div id="searchResults" class="mt-4 space-y-2"></div>
        </section>

        <!-- 2. Добавяне на Нова Кола -->
        <section class="bg-white p-4 rounded-xl shadow border-l-4 border-green-500">
            <h2 class="text-lg font-bold mb-2">➕ Добави Кола-Донор</h2>
            <form id="carForm" onsubmit="addCar(event)" class="space-y-3">
                <input type="text" id="carTitle" placeholder="Марка/Модел (напр. BMW E36 M50B20)" required class="w-full border p-2 rounded text-sm">
                <div class="flex gap-2">
                    <input type="number" id="carPrice" placeholder="Покупна цена (€)" required class="w-full border p-2 rounded text-sm">
                    <select id="carWarehouse" class="w-full border p-2 rounded text-sm">
                        <option value="">Зареждане на складове...</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-lg font-bold text-sm">Запази Кола</button>
            </form>
        </section>

        <!-- 3. СПИСЪК С КОЛИ & ФИНАНСОВ БАЛАНС -->
        <section class="bg-white p-4 rounded-xl shadow">
            <h2 class="text-lg font-bold mb-3 text-gray-800">📋 Налични Коли-Донори</h2>
            <div id="carsList" class="space-y-3">
                <p class="text-xs text-gray-500">Зареждане на колите...</p>
            </div>
        </section>

        <!-- 4. Сканиране & Записване на Част -->
        <section class="bg-white p-4 rounded-xl shadow border-l-4 border-purple-500">
            <h2 class="text-lg font-bold mb-2">📷 Записване на Част</h2>
            
            <form id="partForm" onsubmit="addPart(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Към коя кола принадлежи?</label>
                    <select id="partCarSelect" class="w-full border p-2 rounded text-sm bg-purple-50">
                        <option value="">Без кола (Обща част)</option>
                    </select>
                </div>

                <input type="text" id="partTitle" placeholder="Име на частта (напр. Стартер)" required class="w-full border p-2 rounded text-sm">
                <input type="text" id="partOem" placeholder="OEM / Сериен номер (по избор)" class="w-full border p-2 rounded text-sm">
                
                <div class="flex gap-2">
                    <input type="number" id="partPrice" placeholder="Цена (€)" required class="w-full border p-2 rounded text-sm">
                    <select id="partStatus" class="w-full border p-2 rounded text-sm">
                        <option value="На колата">🚗 На колата</option>
                        <option value="На рафт">📦 На рафт</option>
                    </select>
                </div>

                <input type="text" id="partShelf" placeholder="Локация / Рафт (напр. Рафт A-2)" class="w-full border p-2 rounded text-sm">
                <button type="submit" class="w-full bg-purple-600 text-white py-2 rounded-lg font-bold text-sm">Запази Част</button>
            </form>
        </section>

    </main>

    <script>
        const API_URL = "https://car-parts-k27f.onrender.com";

        // Зареждане при отваряне
        window.onload = function() {
            loadAllData();
        };

        function loadAllData() {
            loadWarehouses();
            loadCarsSummary();
        }

        // 1. Зареждане на складове
        async function loadWarehouses() {
            try {
                const res = await fetch(`${API_URL}/warehouses/`);
                const warehouses = await res.json();
                const select = document.getElementById("carWarehouse");
                select.innerHTML = "";
                
                if (warehouses.length === 0) {
                    select.innerHTML = `<option value="">Няма намерени складове</option>`;
                    return;
                }

                warehouses.forEach(w => {
                    select.innerHTML += `<option value="${w.id}">${w.name}</option>`;
                });
            } catch (err) {
                console.error("Грешка при складовете:", err);
            }
        }

        // 2. Зареждане на колите и баланса
        async function loadCarsSummary() {
            try {
                const res = await fetch(`${API_URL}/cars/summary`);
                const cars = await res.json();
                
                const carsListDiv = document.getElementById("carsList");
                const partCarSelect = document.getElementById("partCarSelect");
                
                carsListDiv.innerHTML = "";
                partCarSelect.innerHTML = `<option value="">Без кола (Обща част)</option>`;

                if (cars.length === 0) {
                    carsListDiv.innerHTML = "<p class='text-xs text-gray-500'>Все още няма добавени коли.</p>";
                    return;
                }

                cars.forEach(car => {
                    // Падащо меню при добавяне на част
                    partCarSelect.innerHTML += `<option value="${car.id}">${car.title}</option>`;

                    // Определяне на цвета за баланса (зелен/червен)
                    const profitClass = car.net_profit >= 0 ? "text-green-600" : "text-red-600";
                    const profitSign = car.net_profit >= 0 ? "+" : "";

                    carsListDiv.innerHTML += `
                        <div class="border rounded-lg p-3 bg-gray-50 space-y-1">
                            <div class="flex justify-between items-start">
                                <span class="font-bold text-gray-900 text-sm">${car.title}</span>
                                <span class="text-xs px-2 py-0.5 rounded bg-blue-100 text-blue-800 font-semibold">Купена: ${car.purchase_price} €</span>
                            </div>
                            <div class="text-xs text-gray-600 flex justify-between">
                                <span>Брой Части: <b>${car.parts_count}</b></span>
                                <span>Продадени за: <b>${car.total_sales} €</b></span>
                            </div>
                            <div class="text-xs font-bold pt-1 border-t flex justify-between">
                                <span>Финансов баланс:</span>
                                <span class="${profitClass}">${profitSign}${car.net_profit} €</span>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("Грешка при колите:", err);
            }
        }

        // 3. Търсене на част
        async function searchParts() {
            const query = document.getElementById("searchInput").value;
            if (!query) return;

            const res = await fetch(`${API_URL}/parts/search?q=${query}`);
            const data = await res.json();
            
            const resultsDiv = document.getElementById("searchResults");
            resultsDiv.innerHTML = "";

            if (data.length === 0) {
                resultsDiv.innerHTML = "<p class='text-xs text-gray-500'>Няма намерени части.</p>";
                return;
            }

            data.forEach(part => {
                resultsDiv.innerHTML += `
                    <div class="border p-3 rounded-lg bg-gray-50">
                        <div class="font-bold text-sm text-blue-900">${part.title}</div>
                        <div class="text-xs text-gray-600">OEM: ${part.oem_number || 'Няма'} | Локация: ${part.shelf_location || part.status}</div>
                        <div class="text-xs font-bold text-green-600 mt-1">Обявена цена: ${part.price} €</div>
                        ${part.status !== 'Продадено' ? 
                          `<button onclick="sellPart(${part.id})" class="mt-2 text-xs bg-red-500 hover:bg-red-600 text-white px-2 py-1 rounded font-bold">💰 Отчети продажба</button>` : 
                          `<div class="text-xs font-bold text-red-600 mt-1">[ПРОДАДЕНО за ${part.sold_price || part.price} €]</div>`}
                    </div>
                `;
            });
        }

        // 4. Добавяне на Кола
        async function addCar(e) {
            e.preventDefault();
            const body = {
                title: document.getElementById("carTitle").value,
                purchase_price: parseFloat(document.getElementById("carPrice").value),
                warehouse_id: parseInt(document.getElementById("carWarehouse").value)
            };

            await fetch(`${API_URL}/cars/`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body)
            });

            alert("Колата е добавена успешно!");
            document.getElementById("carForm").reset();
            loadAllData();
        }

        // 5. Добавяне на Част
        async function addPart(e) {
            e.preventDefault();
            const carIdVal = document.getElementById("partCarSelect").value;
            
            const body = {
                title: document.getElementById("partTitle").value,
                oem_number: document.getElementById("partOem").value,
                price: parseFloat(document.getElementById("partPrice").value),
                status: document.getElementById("partStatus").value,
                shelf_location: document.getElementById("partShelf").value,
                car_id: carIdVal ? parseInt(carIdVal) : null
            };

            await fetch(`${API_URL}/parts/`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body)
            });

            alert("Частта е запазена успешно!");
            document.getElementById("partForm").reset();
            loadCarsSummary();
        }

        // 6. Отчитане на продажба
        async function sellPart(partId) {
            const soldPrice = prompt("Въведете сумата, за която я продадохте (€):");
            if (!soldPrice) return;

            await fetch(`${API_URL}/parts/${partId}/sell`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ sold_price: parseFloat(soldPrice) })
            });

            alert("Продажбата е отчетена успешно!");
            searchParts();
            loadCarsSummary();
        }
    </script>
</body>
</html>
