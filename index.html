<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Parts Inventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-bottom: 50px; }
        .card { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .preview-img { max-width: 100px; max-height: 100px; object-fit: cover; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container mt-4">
    <h2 class="text-center mb-4">🚗 Управление на Автоморги & Части</h2>

    <!-- ТАБОВЕ -->
    <ul class="nav nav-pills nav-justified mb-4" id="mainTab" role="tablist">
        <li class="nav-item">
            <button class="nav-link active" id="search-tab" data-bs-toggle="tab" data-bs-target="#search-pane">🔍 Търсене</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" id="add-part-tab" data-bs-toggle="tab" data-bs-target="#add-part-pane">➕ Добави Част</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" id="cars-tab" data-bs-toggle="tab" data-bs-target="#cars-pane">🚘 Коли / Складове</button>
        </li>
    </ul>

    <div class="tab-content" id="mainTabContent">
        
        <!-- 1. ТЪРСЕНЕ НА ЧАСТИ -->
        <div class="tab-pane fade show active" id="search-pane">
            <div class="card p-3 mb-4">
                <h4>Търсене на авточаст или кола</h4>
                <div class="row g-2 mb-2 align-items-center">
                    <div class="col-md-4">
                        <input type="text" id="search-query" class="form-control" placeholder="Търси по име на част, OEM или рафт...">
                    </div>
                    <div class="col-md-3">
                        <select id="filter-make" class="form-select" onchange="onMakeChange()">
                            <option value="">-- Всички марки --</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <select id="filter-model" class="form-select">
                            <option value="">-- Всички модели --</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-primary w-100 fw-bold py-2" onclick="searchParts()">🔍 Търси</button>
                    </div>
                </div>
            </div>
            <div id="search-results"></div>
        </div>

        <!-- 2. ДОБАВЯНЕ НА ЧАСТ -->
        <div class="tab-pane fade" id="add-part-pane">
            <div class="card p-4">
                <h4>Добавяне на нова част</h4>
                <form id="part-form" onsubmit="savePart(event)">
                    <div class="mb-3">
                        <label class="form-label">Наименование на частта *</label>
                        <input type="text" id="part_title" class="form-control" required placeholder="напр. Скоростна кутия">
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">OEM Номер</label>
                            <input type="text" id="part_oem" class="form-control" placeholder="напр. 8K0807225">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Цена (лв.) *</label>
                            <input type="number" step="0.01" id="part_price" class="form-control" required placeholder="150.00">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Свържи с Кола-Донор</label>
                            <select id="part_car_id" class="form-select">
                                <option value="">-- Избери Кола --</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Място / Склад</label>
                            <input type="text" id="part_shelf" class="form-control" placeholder="напр. Рафт A-12">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Снимка (От камера или галерия)</label>
                        <input type="file" id="part_photo_file" class="form-control" accept="image/*" capture="environment">
                    </div>
                    <button type="submit" class="btn btn-success w-100">Запази Частта</button>
                </form>
            </div>
        </div>

        <!-- 3. УПРАВЛЕНИЕ НА СКЛАДОВЕ И КОЛИ -->
        <div class="tab-pane fade" id="cars-pane">
            <div class="row">
                <!-- СКЛАДОВЕ -->
                <div class="col-md-6 mb-4">
                    <div class="card p-3">
                        <h5>🏭 Добави Нов Склад</h5>
                        <form onsubmit="saveWarehouse(event)">
                            <div class="mb-2">
                                <input type="text" id="wh_name" class="form-control" placeholder="Име на склад (напр. Заден двор)" required>
                            </div>
                            <div class="mb-2">
                                <input type="text" id="wh_address" class="form-control" placeholder="Адрес / Бележка">
                            </div>
                            <button type="submit" class="btn btn-outline-primary btn-sm w-100 mb-3">Създай Склад</button>
                        </form>
                        <h6>Списък със складове:</h6>
                        <ul class="list-group" id="warehouses-list">
                            <li class="list-group-item text-muted">Зареждане...</li>
                        </ul>
                    </div>
                </div>

                <!-- КОЛИ -->
                <div class="col-md-6 mb-4">
                    <div class="card p-3">
                        <h5>🚗 Добави Нова Кола-Донор</h5>
                        <form onsubmit="saveCar(event)">
                            <div class="row mb-2">
                                <div class="col-6">
                                    <input type="text" id="car_make" class="form-control" placeholder="Марка (напр. Audi)" required>
                                </div>
                                <div class="col-6">
                                    <input type="text" id="car_model" class="form-control" placeholder="Модел (напр. A4 B8)" required>
                                </div>
                            </div>
                            <div class="mb-2">
                                <input type="number" step="0.01" id="car_purchase_price" class="form-control" placeholder="Покупна цена (лв.)" required>
                            </div>
                            <div class="mb-2">
                                <select id="car_warehouse_id" class="form-select" required>
                                    <option value="">-- Избери Склад --</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-outline-success btn-sm w-100">Запази Колата</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- СПИСЪК С КОЛИ И БАЛАНС -->
            <div class="card p-3">
                <h5>📊 Налични Коли и Финансов Баланс</h5>
                <div id="cars-summary-list" class="mt-3">
                    <p class="text-muted">Зареждане на данните...</p>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    let globalWarehouses = [];
    let globalCars = [];
    let allPartsData = [];

    document.addEventListener("DOMContentLoaded", function() {
        loadWarehouses();
        loadCars();
        loadCarsSummary();
        searchParts();
    });

    async function loadWarehouses() {
        try {
            const res = await fetch('/warehouses');
            if (!res.ok) return;
            globalWarehouses = await res.json();
            
            const select = document.getElementById('car_warehouse_id');
            const list = document.getElementById('warehouses-list');
            
            select.innerHTML = '<option value="">-- Избери Склад --</option>';
            list.innerHTML = '';

            if (globalWarehouses.length === 0) {
                list.innerHTML = '<li class="list-group-item text-muted">Няма намерени складове.</li>';
                return;
            }

            globalWarehouses.forEach(w => {
                select.innerHTML += `<option value="${w.id}">${w.name}</option>`;
                list.innerHTML += `
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <strong>${w.name}</strong> <small class="text-muted">(${w.address || 'Без адрес'})</small>
                        </div>
                        <div>
                            <button class="btn btn-sm btn-outline-secondary me-1" onclick="editWarehouse(${w.id}, '${w.name}', '${w.address || ''}')">✏️</button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteWarehouse(${w.id})">🗑️</button>
                        </div>
                    </li>`;
            });
        } catch (e) {
            console.error("Грешка при складове:", e);
        }
    }

    async function saveWarehouse(e) {
        e.preventDefault();
        const data = {
            name: document.getElementById('wh_name').value,
            address: document.getElementById('wh_address').value || null
        };

        try {
            const res = await fetch('/warehouses', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });

            if (res.ok) {
                alert('Складът е добавен успешно!');
                document.getElementById('wh_name').value = '';
                document.getElementById('wh_address').value = '';
                loadWarehouses();
            }
        } catch (err) {
            alert('Грешка: ' + err.message);
        }
    }

    async function editWarehouse(id, oldName, oldAddress) {
        const newName = prompt("Въведете ново име за склада:", oldName);
        if (newName === null) return;

        const newAddress = prompt("Въведете нов адрес:", oldAddress || '');
        if (newAddress === null) return;

        try {
            const res = await fetch(`/warehouses/${id}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ 
                    name: newName.trim() !== '' ? newName : oldName, 
                    address: newAddress.trim() !== '' ? newAddress : null 
                })
            });
            if (res.ok) {
                alert('Складът е обновен!');
                loadWarehouses();
            } else {
                alert('Грешка при запис на промените.');
            }
        } catch (err) {
            alert('Грешка при преименуване: ' + err.message);
        }
    }

    async function deleteWarehouse(id) {
        if (!confirm("Сигурни ли сте, че искате да изтриете този склад?")) return;
        try {
            const res = await fetch(`/warehouses/${id}`, { method: 'DELETE' });
            if (res.ok) {
                alert('Складът е изтрит!');
                loadWarehouses();
            }
        } catch (err) {
            alert('Грешка при изтриване: ' + err.message);
        }
    }

    async function loadCars() {
        try {
            const res = await fetch('/cars/summary');
            if (!res.ok) return;
            globalCars = await res.json();

            // Попълваме менюто за създаване на част
            const select = document.getElementById('part_car_id');
            select.innerHTML = '<option value="">-- Без конкретна кола --</option>';
            globalCars.forEach(c => {
                select.innerHTML += `<option value="${c.id}">${c.title}</option>`;
            });

            populateMakeDropdown();
        } catch (e) {
            console.error("Грешка при коли:", e);
        }
    }

    function populateMakeDropdown() {
        const makeSelect = document.getElementById('filter-make');
        makeSelect.innerHTML = '<option value="">-- Всички марки --</option>';

        const makes = [...new Set(globalCars.map(c => c.make).filter(Boolean))];
        makes.sort().forEach(m => {
            makeSelect.innerHTML += `<option value="${m}">${m}</option>`;
        });
    }

    function onMakeChange() {
        const selectedMake = document.getElementById('filter-make').value;
        const modelSelect = document.getElementById('filter-model');
        modelSelect.innerHTML = '<option value="">-- Всички модели --</option>';

        if (!selectedMake) return;

        const filteredModels = globalCars
            .filter(c => c.make === selectedMake)
            .map(c => c.model)
            .filter(Boolean);

        const uniqueModels = [...new Set(filteredModels)];
        uniqueModels.sort().forEach(m => {
            modelSelect.innerHTML += `<option value="${m}">${m}</option>`;
        });
    }

    async function loadCarsSummary() {
        const container = document.getElementById('cars-summary-list');
        try {
            const res = await fetch('/cars/summary');
            if (!res.ok) {
                container.innerHTML = '<p class="text-danger">Грешка при зареждане на баланса.</p>';
                return;
            }
            const cars = await res.json();
            if (cars.length === 0) {
                container.innerHTML = '<p class="text-muted">Все още няма въведени коли.</p>';
                return;
            }
            container.innerHTML = '';
            cars.forEach(c => {
                const profitClass = c.net_profit >= 0 ? 'text-success' : 'text-danger';
                const warehouseName = c.warehouses ? c.warehouses.name : 'Неопределен склад';

                container.innerHTML += `
                    <div class="border rounded p-3 mb-2 bg-light">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6>🚗 <strong>${c.title}</strong></h6>
                                <small class="text-muted">🏭 Склад: <strong>${warehouseName}</strong></small>
                            </div>
                            <div>
                                <button class="btn btn-sm btn-success me-1" onclick="quickSellPartFromCar(${c.id}, '${c.title}')">⚡ Свали & Продай Част</button>
                                <button class="btn btn-sm btn-outline-secondary me-1" onclick="editCar(${c.id}, '${c.make || ''}', '${c.model || ''}', ${c.purchase_price}, ${c.warehouse_id})">✏️</button>
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteCar(${c.id})">🗑️</button>
                            </div>
                        </div>
                        <div class="row text-center mt-2">
                            <div class="col-4"><small class="text-muted">Покупка</small><br><strong>${c.purchase_price} лв.</strong></div>
                            <div class="col-4"><small class="text-muted">Продажби</small><br><strong class="text-primary">${c.total_sales} лв.</strong></div>
                            <div class="col-4"><small class="text-muted">Печалба/Загуба</small><br><strong class="${profitClass}">${c.net_profit} лв.</strong></div>
                        </div>
                    </div>`;
            });
        } catch (e) {
            container.innerHTML = '<p class="text-danger">Грешка при зареждане на баланса.</p>';
        }
    }

    async function quickSellPartFromCar(carId, carTitle) {
        const partName = prompt(`Сваляне на част от: ${carTitle}\nВъведете име на частта (напр. Скоростна кутия):`);
        if (!partName) return;

        const priceStr = prompt(`Въведете продажна цена за "${partName}" (лв.):`);
        if (!priceStr) return;

        const soldPrice = parseFloat(priceStr);
        if (isNaN(soldPrice)) {
            alert("Невалидна цена!");
            return;
        }

        const partData = {
            title: partName,
            price: soldPrice,
            status: "Продадено",
            sold_price: soldPrice,
            car_id: carId
        };

        try {
            const res = await fetch('/parts', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(partData)
            });

            if (!res.ok) {
                alert('Грешка при сваляне на частта.');
                return;
            }

            const createdPart = await res.json();
            const partId = Array.isArray(createdPart) ? createdPart[0].id : createdPart.id;

            if (partId) {
                await fetch(`/parts/${partId}/sell`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ sold_price: soldPrice })
                });
            }

            alert(`Частта "${partName}" беше добавена и маркирана като продадена от ${carTitle}!`);
            searchParts();
            loadCarsSummary();
        } catch (err) {
            alert('Грешка: ' + err.message);
        }
    }

    async function saveCar(e) {
        e.preventDefault();
        const data = {
            make: document.getElementById('car_make').value,
            model: document.getElementById('car_model').value,
            purchase_price: parseFloat(document.getElementById('car_purchase_price').value),
            warehouse_id: parseInt(document.getElementById('car_warehouse_id').value)
        };

        try {
            const res = await fetch('/cars', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });

            if (res.ok) {
                alert('Колата е добавена успешно!');
                document.getElementById('car_make').value = '';
                document.getElementById('car_model').value = '';
                document.getElementById('car_purchase_price').value = '';
                loadCars();
                loadCarsSummary();
            }
        } catch (err) {
            alert('Грешка: ' + err.message);
        }
    }

    async function editCar(id, oldMake, oldModel, oldPrice, oldWhId) {
        const newMake = prompt("Въведете марка:", oldMake);
        if (newMake === null) return;

        const newModel = prompt("Въведете модел:", oldModel);
        if (newModel === null) return;

        const newPrice = prompt("Въведете покупна цена (лв.):", oldPrice);
        if (newPrice === null) return;

        try {
            const res = await fetch(`/cars/${id}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    make: newMake.trim() !== '' ? newMake : oldMake,
                    model: newModel.trim() !== '' ? newModel : oldModel,
                    purchase_price: parseFloat(newPrice) || oldPrice,
                    warehouse_id: oldWhId
                })
            });
            if (res.ok) {
                alert('Колата е обновена успешно!');
                loadCars();
                loadCarsSummary();
            } else {
                alert('Грешка при обновяване на колата.');
            }
        } catch (err) {
            alert('Грешка при редакция: ' + err.message);
        }
    }

    async function deleteCar(id) {
        if (!confirm("Сигурни ли сте, че искате да изтриете тази кола?")) return;
        try {
            const res = await fetch(`/cars/${id}`, { method: 'DELETE' });
            if (res.ok) {
                alert('Колата е изтрита!');
                loadCars();
                loadCarsSummary();
            }
        } catch (err) {
            alert('Грешка при изтриване: ' + err.message);
        }
    }

    async function savePart(e) {
        e.preventDefault();
        let photo_url = null;

        const fileInput = document.getElementById('part_photo_file');
        if (fileInput.files.length > 0) {
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            try {
                const uploadRes = await fetch('/upload-photo', { method: 'POST', body: formData });
                if (uploadRes.ok) {
                    const uploadData = await uploadRes.json();
                    photo_url = uploadData.photo_url;
                }
            } catch (uploadErr) {
                console.error("Грешка при снимката:", uploadErr);
            }
        }

        const car_id_val = document.getElementById('part_car_id').value;
        const partData = {
            title: document.getElementById('part_title').value,
            oem_number: document.getElementById('part_oem').value || null,
            price: parseFloat(document.getElementById('part_price').value),
            shelf_location: document.getElementById('part_shelf').value || null,
            car_id: car_id_val ? parseInt(car_id_val) : null,
            photo_url: photo_url
        };

        try {
            const res = await fetch('/parts', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(partData)
            });

            if (res.ok) {
                alert('Частта е добавена успешно!');
                document.getElementById('part-form').reset();
                searchParts();
                loadCarsSummary();
            }
        } catch (err) {
            alert('Грешка: ' + err.message);
        }
    }

    // --- ТЪРСЕНЕ С ФИЛТРИ КЛИЕНТСКИ ---
    async function searchParts() {
        const query = document.getElementById('search-query').value.trim().toLowerCase();
        const selectedMake = document.getElementById('filter-make').value.toLowerCase();
        const selectedModel = document.getElementById('filter-model').value.toLowerCase();

        const container = document.getElementById('search-results');
        container.innerHTML = '<p class="text-muted">Зареждане...</p>';

        try {
            const res = await fetch('/parts/search');
            allPartsData = await res.json();

            const filteredParts = allPartsData.filter(p => {
                const titleMatch = !query || (p.title && p.title.toLowerCase().includes(query)) || (p.oem_number && p.oem_number.toLowerCase().includes(query)) || (p.shelf_location && p.shelf_location.toLowerCase().includes(query));

                let carMake = p.cars ? (p.cars.make || '').toLowerCase() : '';
                let carModel = p.cars ? (p.cars.model || '').toLowerCase() : '';

                const makeMatch = !selectedMake || carMake === selectedMake;
                const modelMatch = !selectedModel || carModel === selectedModel;

                return titleMatch && makeMatch && modelMatch;
            });

            if (filteredParts.length === 0) {
                container.innerHTML = '<p class="text-muted">Няма намерени резултати.</p>';
                return;
            }

            container.innerHTML = '';
            filteredParts.forEach(p => {
                const imgTag = p.photo_url ? `<img src="${p.photo_url}" class="preview-img me-3">` : '';
                
                let carInfo = 'Обща част';
                let carWarehouse = '';

                if (p.cars) {
                    carInfo = `${p.cars.make || ''} ${p.cars.model || ''}`.trim() || p.cars.title || 'Кола';
                    if (p.cars.warehouses && p.cars.warehouses.name) {
                        carWarehouse = ` | 🏭 Склад: <strong>${p.cars.warehouses.name}</strong>`;
                    }
                }

                container.innerHTML += `
                    <div class="card p-3 mb-2 d-flex flex-row align-items-center">
                        ${imgTag}
                        <div class="flex-grow-1">
                            <h5 class="mb-1">${p.title} <small class="text-primary">(${carInfo}${carWarehouse})</small></h5>
                            <p class="mb-1 text-muted"><small>OEM: ${p.oem_number || 'Няма'} | Място: ${p.shelf_location || 'Няма'}</small></p>
                            <span class="badge bg-${p.status === 'Продадено' ? 'danger' : 'success'}">${p.status}</span>
                        </div>
                        <div class="text-end">
                            <h4 class="text-primary mb-2">${p.sold_price || p.price} лв.</h4>
                            ${p.status !== 'Продадено' ? `<button class="btn btn-sm btn-outline-danger" onclick="sellPart(${p.id})">Маркирай Продадена</button>` : ''}
                        </div>
                    </div>`;
            });
        } catch (e) {
            container.innerHTML = '<p class="text-danger">Грешка при търсенето.</p>';
        }
    }

    async function sellPart(partId) {
        const price = prompt("Въведете крайната цена, на която е продадена частта (лв.):");
        if (!price) return;

        try {
            await fetch(`/parts/${partId}/sell`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ sold_price: parseFloat(price) })
            });

            alert('Частта е маркирана като продадена!');
            searchParts();
            loadCarsSummary();
        } catch (err) {
            alert('Грешка: ' + err.message);
        }
    }
</script>
